<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website builder prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&family=Fraunces:opsz,wght@9..144,400;600;700&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;500;600&family=Public+Sans:wght@400;500;600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Editor chrome (not part of the visitor's site) ───────── */
:root{--c-bg:#f3f2ef;--c-panel:#fff;--c-line:#dedbd4;--c-ink:#1c1b19;--c-mut:#6a665e;--c-acc:#1f4d3a;--c-acc-ink:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Instrument Sans",system-ui,sans-serif;background:var(--c-bg);color:var(--c-ink);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.chrome{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--c-panel);border-bottom:1px solid var(--c-line);flex-wrap:wrap}
.chrome h1{font-size:14px;margin:0;font-weight:600;margin-right:auto}
.chrome .note{font-size:12px;color:var(--c-mut)}
.seg{display:inline-flex;border:1px solid var(--c-line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 11px;min-height:32px;border-right:1px solid var(--c-line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--c-ink);color:#fff}
.tbtn{border:1px solid var(--c-line);background:#fff;border-radius:6px;padding:6px 11px;min-height:32px}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn.primary{background:var(--c-acc);color:var(--c-acc-ink);border-color:var(--c-acc)}
.saved{font-size:12px;color:var(--c-mut);min-width:96px}
.app{flex:1;display:grid;grid-template-columns:268px minmax(0,1fr) 288px;min-height:0}
.side{background:var(--c-panel);overflow:auto;padding:14px;border-right:1px solid var(--c-line)}
.side.right{border-right:0;border-left:1px solid var(--c-line)}
.side h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-mut);margin:18px 0 8px;font-weight:600}
.side h2:first-child{margin-top:0}
.row{display:flex;gap:6px;align-items:center}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.item{display:flex;align-items:center;gap:6px;border:1px solid var(--c-line);border-radius:6px;padding:6px 8px;background:#fff;min-height:36px}
.item.sel{border-color:var(--c-ink);box-shadow:inset 0 0 0 1px var(--c-ink)}
.item .grip{cursor:grab;color:var(--c-mut);user-select:none}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:left;padding:4px 0}
.item.off .nm{opacity:.45;text-decoration:line-through}
.item.drop{border-color:var(--c-acc);background:#eef5f1}
.ib{border:0;background:transparent;border-radius:4px;width:28px;height:28px;color:var(--c-mut);font-size:13px}
.ib:hover{background:#eee}
.badge{font-size:12px;color:var(--c-acc);border:1px solid #bcd3c7;background:#eef5f1;border-radius:4px;padding:0 6px}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.addgrid button{border:1px dashed #b9b5ab;background:#fff;border-radius:6px;padding:8px;text-align:left;min-height:38px}
.addgrid button:hover{border-style:solid;border-color:var(--c-ink)}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label,.field .lbl{font-size:12px;color:var(--c-mut);font-weight:500}
.field input[type=text]{border:1px solid var(--c-line);border-radius:6px;padding:7px 9px;min-height:34px;width:100%}
.field select{border:1px solid var(--c-line);border-radius:6px;padding:7px 9px;min-height:34px;background:#fff;width:100%}
.field .seg{display:flex}.field .seg button{flex:1;padding:6px 4px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--c-line);padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--c-ink)}
input[type=color]{width:44px;height:30px;border:1px solid var(--c-line);border-radius:6px;padding:2px;background:#fff}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl button{border:1px solid var(--c-line);border-radius:6px;background:#fff;padding:0;overflow:hidden;text-align:left}
.tpl button[aria-pressed=true]{outline:2px solid var(--c-ink)}
.tpl .th{height:54px;display:grid;grid-template-rows:1fr 1fr}
.tpl .nmx{padding:6px 8px;font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--c-mut);margin:6px 0 12px}
.live{font-size:12px;border-left:3px solid var(--c-acc);padding:4px 8px;background:#eef5f1;margin:0 0 12px}
.stage{min-width:0;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start;background:#e9e7e2}
.frame{width:100%;max-width:100%;background:#fff;border:1px solid var(--c-line);box-shadow:0 1px 2px rgba(0,0,0,.08);transition:width .25s ease}
.empty{padding:20px;color:var(--c-mut);font-size:13px}
.grp{border:1px solid var(--c-line);border-radius:6px;padding:10px;margin-bottom:12px;background:#fbfaf7}
.grp .field:last-child{margin-bottom:0}
.grp2{border-top:1px solid var(--c-line);margin-top:6px;padding-top:10px}
.grp2 summary{cursor:pointer;font-weight:600;margin-bottom:10px;min-height:32px;display:flex;align-items:center}
.linkf select,.linkf input{margin-top:0}
.linkf{gap:6px}
.linkf.warn label{color:#9a6a00}
.linkrow{list-style:none;border:1px solid var(--c-line);border-radius:6px;padding:10px;background:#fbfaf7}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--c-ink)}
.chk input{margin-top:3px}
.field input[type=text]{min-width:0}
#picker{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
#picker.on{display:flex}
#picker .box{background:#fff;border-radius:8px;max-width:880px;width:100%;max-height:88vh;overflow:auto;padding:18px}
#picker h3{margin:0 0 4px;font-size:18px}
#picker .sub{color:var(--c-mut);margin:0 0 14px;font-size:13px}
#picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#picker-grid button{text-align:left;border:1px solid var(--c-line);background:#fff;border-radius:6px;padding:10px;display:grid;gap:6px;align-content:start}
#picker-grid button:hover,#picker-grid button:focus-visible{border-color:var(--c-ink);outline:none;box-shadow:inset 0 0 0 1px var(--c-ink)}
#picker-grid svg{width:100%;height:auto;background:#f1efe9;border-radius:4px;fill:#9a968c}
#picker-grid svg .l{fill:#d3cfc4}#picker-grid svg .l2{fill:#f1efe9}#picker-grid svg .d{fill:#1c1b19}
#picker-grid b{font-weight:600}
#picker-grid span{font-size:12px;color:var(--c-mut);line-height:1.4}
#fmt{position:fixed;z-index:60;display:none;background:#1c1b19;border-radius:6px;padding:4px;gap:2px;box-shadow:0 4px 14px rgba(0,0,0,.3);align-items:center}
#fmt.on{display:flex}
#fmt button{border:0;background:transparent;color:#fff;min-height:32px;min-width:34px;padding:0 9px;border-radius:4px;font:500 13px "Instrument Sans",sans-serif}
#fmt button:hover{background:#3a3835}
#fmt .linkbox{display:none;gap:4px;align-items:center}
#fmt.linking .tools{display:none}
#fmt.linking .linkbox{display:flex}
#fmt input{min-height:32px;border:0;border-radius:4px;padding:0 8px;width:200px;font:13px "Instrument Sans",sans-serif}
.menued{gap:8px}
.mrow{border:1px solid var(--c-line);border-radius:6px;padding:6px 8px;background:#fff;display:grid;gap:6px}
.mrow input{border:1px solid var(--c-line);border-radius:6px;padding:6px 8px;min-height:32px;width:100%;font-size:13px}
.feats{gap:6px}
.feat{border:1px solid var(--c-line);border-radius:6px;padding:8px 10px;background:#fff}
.feat .chk{align-items:flex-start}
.feat small{display:block;color:var(--c-mut);font-size:12px;line-height:1.4;margin-top:2px}
.feat small.cnt{color:var(--c-acc)}
.feat.off{opacity:.55}
.addgrid button[disabled],#picker-grid button[disabled]{opacity:.45;cursor:not-allowed;border-style:solid}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--c-ink);color:#fff;padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:#fff;text-decoration:underline;padding:0;font-weight:600}
@media(max-width:1100px){.app{grid-template-columns:230px minmax(0,1fr) 250px}}
/* Builder on tablets and phones: the page fills the screen; the two panels slide up as sheets from a tab bar */
.tabbar{display:none}
.side .grab{display:none}
@media(max-width:1180px) and (min-width:901px){.app{grid-template-columns:216px minmax(0,1fr) 248px}.side{padding:12px}}
@media(max-width:900px){
  .chrome{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:8px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chrome::-webkit-scrollbar{display:none}
  .chrome>*{flex:none}
  .chrome h1{font-size:13px;margin-right:auto;white-space:nowrap}.chrome .note{display:none}
  .saved{min-width:0;font-size:11.5px;white-space:nowrap}
  .tbtn,.seg button{min-height:40px}
  .app{display:block;position:relative;min-height:0;flex:1}
  .stagewrap{height:100%}
  .stage{height:100%;padding:10px 10px 74px}
  .frame{max-width:100%}
  .side,.side.right{position:fixed;left:0;right:0;bottom:62px;z-index:45;max-height:min(70vh,640px);border:0;border-radius:20px 20px 0 0;box-shadow:0 -14px 44px rgba(20,20,18,.28);padding:6px 16px 20px;transform:translateY(112%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s .32s;overscroll-behavior:contain}
  .side.show{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s}
  .side .grab{display:block;position:sticky;top:0;z-index:2;height:22px;margin:0 -16px 6px;background:var(--c-panel);cursor:pointer;border:0;width:calc(100% + 32px)}
  .side .grab::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:#cfcbc2;margin:9px auto 0}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;height:62px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px;background:var(--c-panel);border-top:1px solid var(--c-line)}
  .tabbar button{border:0;background:transparent;border-radius:12px;font-weight:600;font-size:13px;color:var(--c-mut);display:grid;place-items:center;gap:2px;min-height:48px;position:relative}
  .tabbar button[aria-pressed=true]{background:var(--c-ink);color:#fff}
  .tabbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar .dot{position:absolute;top:8px;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:#2f6fed;border:2px solid var(--c-panel)}
  .toast{bottom:76px;max-width:calc(100vw - 24px)}
  #picker{padding:0;align-items:flex-end}#picker .box{border-radius:20px 20px 0 0;max-height:86vh;padding:16px}
  #picker-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  #fmt{max-width:calc(100vw - 16px);overflow-x:auto}#fmt input{width:150px}
}
@media(max-width:700px){#device{display:none}#publish{margin-left:auto}}
@media(max-width:560px){.chrome h1{display:none}#previewbtn{display:none}.saved{margin-left:auto}#publish{margin-left:0}}

/* ───────── The visitor's site: everything is driven by tokens ───────── */
.site{container-type:inline-size;container-name:site;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;position:relative;
  --r:0px;--bg:#fbfaf6;--ink:#1d211e;--mut:#5d655f;--line:#dcd9cf}
.site *{box-sizing:border-box}
.site h1,.site h2,.site h3{font-family:var(--fd);margin:0;line-height:1.12;letter-spacing:-.01em;font-weight:var(--fw,600)}
.site p{margin:0}
.site a:not(.btn){color:inherit}
.site [contenteditable]{outline:none;cursor:text;border-radius:2px}
.site [contenteditable]:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--p) 35%,transparent)}
.site [contenteditable]:focus{box-shadow:0 0 0 2px var(--p)}
.hdr{display:flex;align-items:center;gap:20px;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;flex-wrap:nowrap}
.logo{flex:0 1 auto;max-width:44%;display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:var(--fw,600);font-size:19px;min-width:0}
.lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mark{width:34px;height:34px;background:var(--p);color:var(--on-p);display:grid;place-items:center;border-radius:var(--r);font-size:16px;flex:none}
.menu{display:flex;gap:4px;margin-left:auto;align-items:center;flex:1;justify-content:flex-end;min-width:0}
.mitems{display:flex;gap:4px;align-items:center;min-width:0}
.mi{position:relative;flex:none}
.mi>button,.mi>.mg{white-space:nowrap;max-width:22ch;overflow:hidden;text-overflow:ellipsis}
.mg::after{content:"";display:inline-block;border:4px solid transparent;border-top-color:currentColor;border-bottom-width:0;margin-left:7px;vertical-align:2px}
.mpop{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:210px;max-width:300px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 28px rgba(0,0,0,.16);padding:6px;z-index:40}
.mgroup>.mpop{right:auto;left:0}
.mi.open>.mpop{display:block}
.mpop button{display:block;width:100%;text-align:left;white-space:normal;padding:10px 12px}
.mpop .mh{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:8px 12px 2px}
.menu .mi.open>.mg{background:var(--tint)}
.menu button{background:none;border:0;padding:8px 10px;border-radius:var(--r);color:var(--ink);font-size:15px}
.menu button.on{box-shadow:inset 0 -2px 0 var(--p)}
.menu button:hover{background-color:var(--tint)}
.menu .signin{background:var(--p);color:var(--on-p);margin-left:8px;white-space:nowrap;flex:none}
.nav-toggle{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;color:var(--ink)}
.sec{position:relative;padding:var(--sp,72px) 32px;background:var(--bg)}
.sec.sp-c{--sp:44px}.sec.sp-n{--sp:72px}.sec.sp-r{--sp:110px}
.sec.bg-tint{background:var(--tint)}
.sec.bg-brand{background:var(--p);color:var(--on-p);--line:color-mix(in srgb,var(--on-p) 28%,transparent);--mut:color-mix(in srgb,var(--on-p) 78%,transparent)}
.sec.bg-brand .btn{background:var(--on-p);color:var(--p);border-color:var(--on-p)}
.sec.bg-brand .btn.ghost{background:transparent;color:var(--on-p)}
.sec.selected{outline:2px solid #2f6fed;outline-offset:-2px}
.sec .tag{display:none;position:absolute;left:0;top:0;z-index:5;background:#2f6fed;color:#fff;font:600 12px/1 "Instrument Sans",sans-serif;padding:5px 8px;pointer-events:none}
.sec:hover .tag,.sec.selected .tag{display:block}
.sec.hidden{display:none}
.tb{display:none;position:absolute;right:10px;top:10px;z-index:8;gap:4px;background:#fff;border:1px solid #cfcbc2;border-radius:6px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sec.selected>.tb{display:flex}
.tb button{border:0;background:transparent;color:#1c1b19;font:500 13px "Instrument Sans",sans-serif;padding:6px 9px;min-height:32px;border-radius:4px}
.tb button:hover{background:#eee}
.tb button.danger{color:#a3261c}
.rm{position:absolute;right:8px;top:8px;z-index:4;border:0;border-radius:4px;background:rgba(20,20,20,.7);color:#fff;font:500 12px "Instrument Sans",sans-serif;padding:6px 9px;min-height:30px;opacity:0;transition:opacity .15s}
.img:hover>.rm,.rm:focus{opacity:1}
.hero-full .tb{top:60px}
.hdr.overlay ~ .hero-full .pick{top:84px}
.hdr.overlay ~ .hero-full .tb{top:130px}
.logo img{height:36px;width:auto;max-width:180px;object-fit:contain;display:block}
.hdr.sticky{position:sticky;top:0;z-index:30}
.hdr.overlay{position:absolute;top:0;left:0;right:0;background:transparent;border-bottom-color:rgba(255,255,255,.28);z-index:10;color:#fff}
.hdr.overlay .menu button:not(.signin),.hdr.overlay .logo,.hdr.overlay .nav-toggle{color:#fff}
.hdr.overlay .mpop button{color:var(--ink)}
.hdr.overlay .mpop button.on{box-shadow:inset 3px 0 0 var(--p)}
.hdr.overlay .nav-toggle{border-color:rgba(255,255,255,.55)}
.hdr.overlay.open{background:rgba(10,10,10,.88)}
.ins{height:0;position:relative;z-index:7}
.ins::before{content:"";position:absolute;left:0;right:0;top:-14px;height:28px}
.ins button{position:absolute;left:50%;top:-15px;transform:translateX(-50%);opacity:0;pointer-events:none;border:0;background:#2f6fed;color:#fff;font:600 13px "Instrument Sans",sans-serif;padding:0 14px;min-height:30px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:opacity .12s}
.ins:hover button,.ins button:focus-visible{opacity:1;pointer-events:auto}
.ins::after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:#2f6fed;opacity:0;pointer-events:none}
.ins:hover::after{opacity:.55}
/* Footer: its own surface, columns grouped by purpose, real contact links, legal row */
.ft{--fbg:color-mix(in srgb,var(--p) 22%,#0c0f0d);--fink:#f3f1ea;--fmut:color-mix(in srgb,var(--fink) 72%,transparent);--fline:color-mix(in srgb,var(--fink) 18%,transparent);
  background:var(--fbg);color:var(--fink);padding:64px 32px 28px;font-size:15px}
.ft.brand{--fbg:var(--p);--fink:var(--on-p)}
.ft.light{--fbg:var(--tint);--fink:var(--ink)}
.ft .wrap{max-width:1120px}
.ftgrid{display:grid;grid-template-columns:var(--ftw);gap:40px 40px}
.fbrand .logo{color:var(--fink);margin-bottom:14px;max-width:none}
.fbrand .lname{white-space:normal}
.ft .mark{background:var(--fink);color:var(--fbg)}
.flogo{display:inline-block;background:#fff;border-radius:var(--r);padding:8px 12px;margin-bottom:14px}
.flogo img{height:34px;width:auto;max-width:180px;object-fit:contain;display:block}
.fbrand p{color:var(--fmut);max-width:38ch}
.fcta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.ft .btn{background:var(--fink);color:var(--fbg);border-color:var(--fink);min-height:42px}
.ft .btn.ghost{background:transparent;color:var(--fink);border-color:var(--fline)}
.fsoc{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.fsoc a{border:1px solid var(--fline);padding:8px 14px;border-radius:var(--r);font-size:14px;text-decoration:none;min-height:38px;display:inline-flex;align-items:center}
.fsoc a:hover{background:color-mix(in srgb,var(--fink) 10%,transparent)}
.fth{font:600 12px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--fmut);margin-bottom:14px}
.fcol nav{display:grid;justify-items:start}
.fcol nav button{background:none;border:0;color:var(--fink);font:inherit;padding:7px 0;min-height:36px;text-align:left;cursor:pointer}
.fcol nav button:hover,.fcol a:hover{text-decoration:underline;text-underline-offset:3px}
.fcol address{font-style:normal;display:grid;gap:4px}
.fcol address a,.fcol address p{overflow-wrap:anywhere}
.fcol address a[title*="Calls"]{white-space:nowrap}
.fcol address a{color:var(--fink);padding:6px 0;min-height:36px;display:flex;align-items:center;width:fit-content;cursor:pointer}
.fcol address p{margin:0 0 6px;color:var(--fink)}
.legal{margin-top:48px;padding-top:20px;border-top:1px solid var(--fline);display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;font-size:13px;color:var(--fmut)}
.legal nav{display:flex;gap:4px 18px;flex-wrap:wrap}
.legal button{background:none;border:0;color:var(--fmut);font:inherit;padding:6px 0;min-height:32px;cursor:pointer}
.legal button:hover{color:var(--fink);text-decoration:underline;text-underline-offset:3px}
.legal .credit{opacity:.9}

let past=[],future=[];
const snap=()=>JSON.stringify(S);

function restore(json){ S=JSON.parse(json); renderAll(); touch(true); }
function touch(silent){ $("#undo").disabled=!past.length; $("#redo").disabled=!future.length; if(silent)return; const el=$("#saved"); el.textContent="Saving…"; clearTimeout(touch.t); touch.t=setTimeout(()=>el.textContent="Saved just now",700); }
function $(q,root=document){return root.querySelector(q)}
function $$(q,root=document){return [...root.querySelectorAll(q)]}
$("#undo").onclick=()=>{ if(!past.length)return; future.push(snap()); restore(past.pop()); };
$("#redo").onclick=()=>{ if(!future.length)return; past.push(snap()); restore(future.pop()); };

  if(i.type==="legal"){ const t=i.which==="terms"?"Terms of use":"Privacy policy"; return `<div class="dtc"><span class="eyebrow">Legal</span><h1>${t}</h1><p class="dlead">This page is kept for you by the platform, so it is always current and the same on your website and your portal.</p>${[0,1,2].map(()=>`<p>${i.which==="terms"?"The rules for using this community, written in plain language.":"What we collect about members, why we collect it and who can see it."}</p>`).join("")}${url(i.path)}</div>`; }
  return `<div class="dtc dcenter"><span class="dico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8.5 11h5"/></svg></span><h1>We can't find that page</h1><p class="dlead">The link may be old, or the item was taken down. Nothing is wrong on your side.</p><div class="dbtns"><a class="btn" data-rtclose>Back to the website</a>${i.kind?`<a class="btn ghost" data-route="/${i.kind}">See all ${KINDS[i.kind].label.toLowerCase()}</a>`:""}</div></div>`;
}
function syncRoute(){
  const i=routeInfo(location.hash), el=rtEl(); const my=++RT.token;
  if(i.type==="none"){ if(!el.hidden){ el.classList.add("out"); setTimeout(()=>{ if(RT.token!==my)return; el.hidden=true; el.classList.remove("out"); el.innerHTML=""; if(RT.opener&&document.contains(RT.opener)) RT.opener.focus({preventScroll:true}); },220); } return; }
  if(!PREVIEW) $("#previewbtn").click();
  const was=!el.hidden&&!el.classList.contains("out"); el.classList.remove("out");
  const par=parentOf(i);
  el.innerHTML=`<div class="rtp site vibe ${was?"still":""}" style="${tokens()}" role="dialog" aria-modal="true" aria-label="${esc(crumbOf(i).slice(-1)[0].replace(/&amp;/g,"&"))}" tabindex="-1"><header class="rth"><button class="rtb" data-rtback aria-label="${par?"Back":"Close"}">${par?'<svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>':'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'}</button><nav class="crumb" aria-label="Where you are">${crumbOf(i).map(c=>`<span>${c}</span>`).join("")}</nav>${par?'<button class="rtb" data-rtclose aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>':""}</header><div class="rtbody" aria-live="polite">${skeletonBody(i)}</div></div>`;
  el.hidden=false; pbar(); el.querySelector(".rtp").focus({preventScroll:true});
  const slow=i.type==="detail"||i.type==="list";
  setTimeout(()=>{ if(RT.token!==my)return; const b=el.querySelector(".rtbody"); if(!b)return; b.innerHTML=bodyFor(i); b.classList.add("in"); b.scrollTop=0; el.querySelector(".rtp").scrollTop=0; hydrateImages(el); },slow?(was?420:720):260);
}
window.addEventListener("hashchange",syncRoute); window.addEventListener("popstate",syncRoute);
document.addEventListener("click",e=>{
  const rtc=e.target.closest("[data-rtclose]"); if(rtc){ e.preventDefault(); closeRoute(); return; }
  const rtb=e.target.closest("[data-rtback]"); if(rtb){ e.preventDefault(); const par=parentOf(routeInfo(location.hash)); if(par) openRoute(par); else closeRoute(); return; }
  if(e.target.id==="rt"){ closeRoute(); return; }
  const cp=e.target.closest("[data-copy]"); if(cp){ try{ navigator.clipboard.writeText(cp.dataset.copy); }catch(_){} toast("Link copied."); return; }
  const fk=e.target.closest("[data-fake]"); if(fk){ toast(fk.dataset.fake+". In this prototype it stops here."); return; }
  const ext=e.target.closest("#site [data-ext]"); if(ext){ e.preventDefault(); if(PREVIEW) window.open(ext.dataset.ext,"_blank","noopener"); else toast("Opens "+ext.dataset.ext+" for visitors. Try Preview."); return; }
  const r=e.target.closest("[data-route]"); if(!r) return;
  const inSite=!!e.target.closest("#site"), inRt=!!e.target.closest("#rt"); if(!inSite&&!inRt) return;
  e.preventDefault();
  if(inSite&&!PREVIEW){ toast("Visitors go to "+r.dataset.route+" here. Try Preview to see it."); return; }
  openRoute(r.dataset.route);
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!rtEl().hidden){ e.preventDefault(); closeRoute(); } });
$("#previewbtn").addEventListener("click",()=>{ if(!PREVIEW&&!rtEl().hidden){ history.replaceState(null,"",location.pathname+location.search); rtEl().hidden=true; rtEl().innerHTML=""; RT.token++; } if(PREVIEW) pbar(); });

/* ───────── Command palette: press Ctrl/Cmd K and type what you want ───────── */
const CMD={open:false,list:[],sel:0};
function addSectionOfType(type){ remember(); const sec=mk(type,null,{...(COPY[type]||{heading:BLOCKS[type].name})}); const at=(curPage().sections.length&&curPage().sections[curPage().sections.length-1].type==="cta")?curPage().sections.length-1:curPage().sections.length; curPage().sections.splice(at,0,sec); S.sel=sec.id; morph(renderAll); setTimeout(()=>document.querySelector(`[data-block="${sec.id}"]`)?.scrollIntoView({block:"center",behavior:"smooth"}),80); toast(`“${BLOCKS[type].name}” added.`,"Undo",()=>$("#undo").click()); }
function pickSection(id){ PREVIEW&&$("#previewbtn").click(); S.sel=id; renderAll(); setTimeout(()=>document.querySelector(`[data-block="${id}"]`)?.scrollIntoView({block:"center",behavior:"smooth"}),60); }
function commands(){
  const c=[]; const A=(group,label,hint,run)=>c.push({group,label,hint,run});
  A("Do","Preview the site as a visitor","P",()=>$("#previewbtn").click());
  A("Do","Publish…","",()=>openPublish());
  A("Do","Undo","Ctrl Z",()=>$("#undo").click()); A("Do","Redo","Ctrl Shift Z",()=>$("#redo").click());
  [["Desktop","100%"],["Tablet","792px"],["Phone","414px"]].forEach(([n])=>A("View",`Show on ${n.toLowerCase()}`,"",()=>$$("#device button").find(b=>b.textContent===n)?.click()));
  curPage().sections.forEach(x=>A("Go to section",BLOCKS[x.type].name+(x.menu&&x.menu.on?` · ${x.menu.label}`:""),isOn(featOfSec(x))?"":"off",()=>pickSection(x.id)));
  Object.entries(BLOCKS).forEach(([k,b])=>{ if(isOn(b.feature)) A("Add a section",b.name,"",()=>addSectionOfType(k)); });
  Object.entries(TEMPLATES).forEach(([k,t])=>A("Look",`Use the ${t.name} look`,S.template===k?"current":"",()=>{ const b=document.querySelector(`[data-tpl="${k}"]`); b?b.click():null; }));
  A("Branding",S.useBrand?"Website uses your institution's branding":"Go back to your institution's branding",S.useBrand?"on":"",()=>{ if(!S.useBrand){ remember(); S.useBrand=true; renderAll(); toast("Back to your institution's branding."); } });
  A("Help","See keyboard shortcuts","?",()=>toast("Ctrl K search · P preview · Ctrl Z undo · Ctrl Shift Z redo · Delete removes the selected section · Esc closes"));
  return c;
}
function openCmd(){ CMD.open=true; CMD.sel=0; const el=$("#cmdk"); el.hidden=false; $("#cmdq").value=""; drawCmd(); setTimeout(()=>$("#cmdq").focus(),20); }
function closeCmd(){ CMD.open=false; $("#cmdk").hidden=true; }
function drawCmd(){
  const q=$("#cmdq").value.trim().toLowerCase().split(/\s+/).filter(Boolean); const all=commands();
  CMD.list=all.filter(x=>q.every(w=>(x.label+" "+x.group).toLowerCase().includes(w))).slice(0,40); CMD.sel=Math.min(CMD.sel,Math.max(0,CMD.list.length-1));
  let last=""; $("#cmdl").innerHTML=CMD.list.length?CMD.list.map((x,i)=>{ const g=x.group!==last?(last=x.group,`<li class="cmdg" role="presentation">${x.group}</li>`):""; return `${g}<li role="option" id="cm${i}" class="cmdi ${i===CMD.sel?"on":""}" aria-selected="${i===CMD.sel}" data-ci="${i}"><span>${esc(x.label)}</span>${x.hint?`<small>${esc(x.hint)}</small>`:""}</li>`; }).join(""):`<li class="cmdempty">Nothing matches “${esc($("#cmdq").value)}”. Try a section name, like “events”.</li>`;
  $("#cmdl").querySelector(".on")?.scrollIntoView({block:"nearest"});
}
function runCmd(i){ const x=CMD.list[i]; if(!x)return; closeCmd(); setTimeout(()=>x.run(),30); }
$("#cmdbtn").onclick=openCmd;
$("#cmdq").addEventListener("input",()=>{ CMD.sel=0; drawCmd(); });
$("#cmdq").addEventListener("keydown",e=>{ if(e.key==="ArrowDown"){ e.preventDefault(); CMD.sel=Math.min(CMD.list.length-1,CMD.sel+1); drawCmd(); } else if(e.key==="ArrowUp"){ e.preventDefault(); CMD.sel=Math.max(0,CMD.sel-1); drawCmd(); } else if(e.key==="Enter"){ e.preventDefault(); runCmd(CMD.sel); } });
$("#cmdl").addEventListener("click",e=>{ const li=e.target.closest("[data-ci]"); if(li) runCmd(+li.dataset.ci); });
$("#cmdl").addEventListener("mousemove",e=>{ const li=e.target.closest("[data-ci]"); if(li&&+li.dataset.ci!==CMD.sel){ CMD.sel=+li.dataset.ci; $$("#cmdl .cmdi").forEach(x=>x.classList.toggle("on",+x.dataset.ci===CMD.sel)); } });
$("#cmdk").addEventListener("mousedown",e=>{ if(e.target.id==="cmdk") closeCmd(); });
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey, typing=e.target.closest&&e.target.closest("input,textarea,select,[contenteditable]");
  if(mod&&e.key.toLowerCase()==="k"){ e.preventDefault(); CMD.open?closeCmd():openCmd(); return; }
  if(e.key==="Escape"){ if(CMD.open) closeCmd(); if(!$("#pub").hidden&&!PUB.busy) closePublish(); return; }
  if(typing||CMD.open||!$("#pub").hidden) return;
  if(mod&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?$("#redo").click():$("#undo").click(); }
  else if(mod&&e.key.toLowerCase()==="y"){ e.preventDefault(); $("#redo").click(); }
  else if(!mod&&!e.altKey&&e.key.toLowerCase()==="p"){ $("#previewbtn").click(); }
});

/* ───────── Publish: check the page, say what needs a look, then go live ───────── */
const PUB={busy:false,live:null};
function checks(){
  const out=[]; const secs=curPage().sections.filter(x=>!x.hidden&&isOn(featOfSec(x)));
  const dead=[]; secs.forEach(x=>{ const keys=x.type==="hero"?["b1","b2"].filter(k=>x.props[k]):x.type==="cta"?["b1"]:x.type==="imagetext"?["link"]:[]; keys.forEach(k=>{ if(!linkOk(getLink(x,k))) dead.push({id:x.id,what:`“${x.props[k]}” in ${BLOCKS[x.type].name}`}); }); (x.items||[]).forEach(it=>{ if(x.type==="cards"&&it.btn!==""&&!linkOk(getLink(it,"btn"))) dead.push({id:x.id,what:`“${it.btn}” on the card “${it.title}”`}); }); });
  out.push(dead.length?{ok:false,text:`${dead.length} button${dead.length===1?"":"s"} go nowhere yet`,detail:dead.slice(0,3).map(d=>d.what).join(", ")+(dead.length>3?` and ${dead.length-3} more`:""),fix:dead[0].id}:{ok:true,text:"Every button goes somewhere"});
  const empt=secs.filter(x=>"heading" in x.props&&!String(x.props.heading).trim()); out.push(empt.length?{ok:false,text:`${empt.length} section${empt.length===1?" has":"s have"} no heading`,detail:"A heading helps visitors and search engines.",fix:empt[0].id}:{ok:true,text:"Every section has a heading"});
  const m=menuItems().length; out.push(m>=2?{ok:true,text:`The menu has ${m+1} items, and jumps to each section`}:{ok:false,text:"The menu is nearly empty",detail:"Tick “In menu” on the sections visitors will look for."});
  out.push(S.foot.email||S.foot.phone?{ok:true,text:"Visitors can contact you from the footer"}:{ok:false,text:"The footer has no contact details",detail:"Add an email or phone number under Header & footer."});
  out.push({ok:true,text:S.useBrand?"Using your institution's colours and logo":"Custom website colours are easy to read on every background"});
  const off=Object.entries(S.features).filter(([,v])=>!v).length; if(off) out.push({ok:true,info:true,text:`${off} feature${off===1?" is":"s are"} switched off, so visitors will not see ${off===1?"it":"them"}`});
  return out;
}
function openPublish(){ if(PUB.busy)return; PUB.step="check"; drawPublish(); $("#pub").hidden=false; setTimeout(()=>$("#pub .mbox").querySelector("button.primary,button")?.focus(),30); }
function closePublish(){ $("#pub").hidden=true; }
function drawPublish(){
  const box=$("#pub .mbox"), url=`${HOST}`;
  if(PUB.step==="check"){ const cs=checks(), bad=cs.filter(c=>!c.ok).length;
    box.innerHTML=`<div class="mh"><h2 id="pubt">${bad?"Almost ready":"Ready to go live"}</h2><button class="ib" data-pubclose aria-label="Close">✕</button></div><p class="msub">${bad?`${bad} thing${bad===1?"":"s"} to look at. You can publish anyway, or fix ${bad===1?"it":"them"} first.`:"Everything looks good. Your changes go live in about a second."}</p><ul class="checks">${cs.map(c=>`<li class="${c.ok?(c.info?"info":"ok"):"warn"}"><span class="ci" aria-hidden="true">${c.ok?(c.info?"i":"✓"):"!"}</span><span class="ct"><b>${esc(c.text)}</b>${c.detail?`<small>${esc(c.detail)}</small>`:""}</span>${c.fix?`<button class="lnk" data-pubfix="${c.fix}">Show me</button>`:""}</li>`).join("")}</ul><div class="mf"><button class="tbtn" data-pubclose>${bad?"Keep editing":"Not yet"}</button><button class="tbtn primary" data-pubgo>${bad?"Publish anyway":"Publish now"}</button></div>`; }
  else if(PUB.step==="busy"){ const steps=["Checking the page","Preparing your photos","Going live"]; box.innerHTML=`<div class="mh"><h2 id="pubt">Publishing…</h2></div><ol class="psteps">${steps.map((t,i)=>`<li class="${PUB.n>i?"done":PUB.n===i?"now":""}"><span class="ci">${PUB.n>i?"✓":""}</span>${t}</li>`).join("")}</ol><div class="pbarx"><i style="width:${Math.min(100,(PUB.n+.4)/steps.length*100)}%"></i></div>`; }
  else box.innerHTML=`<div class="done"><div class="confetti" aria-hidden="true">${Array.from({length:18},(_,i)=>`<i style="--a:${i*20}deg;--d:${50+(i*37)%46}px;--c:${["#1f7f78","#ffd98a","#f0a35a","#7fd1c4","#e0627a"][i%5]};--t:${(i%6)*40}ms"></i>`).join("")}</div><span class="bigcheck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><h2 id="pubt">Your website is live</h2><p class="msub">Visitors see the new version now. It is saved, and you can undo any change later.</p><div class="liveurl"><span>${LOCK}https://${url}</span><button class="lnk" data-copy="https://${url}">Copy link</button></div><div class="mf"><button class="tbtn" data-pubclose>Done</button><button class="tbtn primary" data-pubview>See it as a visitor</button></div></div>`;
}
$("#publish").onclick=openPublish;
$("#pub").addEventListener("mousedown",e=>{ if(e.target.id==="pub"&&!PUB.busy) closePublish(); });
$("#pub").addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.pubclose!==undefined) closePublish();
  else if(t.dataset.pubfix){ closePublish(); pickSection(t.dataset.pubfix); }
  else if(t.dataset.pubview!==undefined){ closePublish(); if(!PREVIEW) $("#previewbtn").click(); }
  else if(t.dataset.pubgo!==undefined){ PUB.busy=true; PUB.step="busy"; PUB.n=0; drawPublish(); const tick=()=>{ PUB.n++; if(PUB.n>=3){ PUB.busy=false; PUB.step="done"; PUB.live=Date.now(); $("#livepill").hidden=false; $("#saved").textContent="Published just now"; drawPublish(); $("#pub .mbox button.primary")?.focus(); } else { drawPublish(); setTimeout(tick,650); } }; setTimeout(tick,700); }
});

/* ───────── A first-visit tip, once ───────── */
(function(){ let seen=false; try{ seen=localStorage.getItem("wb-tip")==="1"; }catch(_){} if(seen) return;
  const t=document.createElement("div"); t.className="tip"; t.innerHTML='<b>Make it yours</b><span>Click any <u>text</u> or <u>photo</u> on the page to change it. Press <kbd>Ctrl</kbd> <kbd>K</kbd> to find anything.</span><button class="tbtn" aria-label="Dismiss tip">Got it</button>'; document.querySelector(".stagewrap").appendChild(t);
  t.querySelector("button").onclick=()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),300); try{ localStorage.setItem("wb-tip","1"); }catch(_){} }; })();

/* tablets and phones: panels are sheets. Opening one closes the other; choosing something closes the sheet so the page is visible again. */
const narrow=()=>matchMedia("(max-width:900px)").matches;
function sheet(which){
  const l=$("#left"),r=$("#right");
  const next=which==="left"?!l.classList.contains("show"):which==="right"?!r.classList.contains("show"):false;
  l.classList.toggle("show",which==="left"&&next); r.classList.toggle("show",which==="right"&&next);
  $$(".tabbar [data-sheet]").forEach(b=>b.setAttribute("aria-pressed",String((b.dataset.sheet==="left"&&l.classList.contains("show"))||(b.dataset.sheet==="right"&&r.classList.contains("show"))||(b.dataset.sheet==="preview"&&PREVIEW))));
}
$$(".side").forEach(x=>x.insertAdjacentHTML("afterbegin",'<button class="grab" data-sheet="none" aria-label="Close panel"></button>'));
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-sheet]"); if(b){ const w=b.dataset.sheet; if(w==="preview"){ sheet("none"); $("#previewbtn").click(); } else sheet(w); return; }
  if(!narrow())return;
  if(e.target.closest("#left [data-pick]")){ sheet("right"); return; }
  if(e.target.closest("#left [data-add]")){ sheet("none"); return; }
  if(e.target.closest("#right [data-tpl],#right [data-color],#right [data-tplreset]")) return;
  if(e.target.closest(".stage")&&($(".side.show"))) sheet("none");
});
const _renderRight=renderRight; renderRight=function(){ const keep=$("#right").classList.contains("show"); _renderRight(); $("#right").insertAdjacentHTML("afterbegin",'<button class="grab" data-sheet="none" aria-label="Close panel"></button>'); $("#right").classList.toggle("show",keep); const d=$("#seldot"); if(d) d.hidden=!S.sel; };
const _renderLeft=renderLeft; renderLeft=function(){ const keep=$("#left").classList.contains("show"); _renderLeft(); $("#left").insertAdjacentHTML("afterbegin",'<button class="grab" data-sheet="none" aria-label="Close panel"></button>'); $("#left").classList.toggle("show",keep); };
$("#previewbtn").addEventListener("click",()=>{ $$(".tabbar [data-sheet=preview]").forEach(b=>b.setAttribute("aria-pressed",String(PREVIEW))); });
renderAll(); touch(true);
if(/^#\//.test(location.hash)) syncRoute();
</script>
