<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website builder prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&family=Fraunces:opsz,wght@9..144,400;600;700&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ───────── Editor chrome (not part of the visitor's site) ───────── */
:root{--c-bg:#f3f2ef;--c-panel:#fff;--c-line:#dedbd4;--c-ink:#1c1b19;--c-mut:#6a665e;--c-acc:#1f4d3a;--c-acc-ink:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Instrument Sans",system-ui,sans-serif;background:var(--c-bg);color:var(--c-ink);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.chrome{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--c-panel);border-bottom:1px solid var(--c-line);flex-wrap:wrap}
.chrome h1{font-size:14px;margin:0;font-weight:600;margin-right:auto}
.chrome .note{font-size:12px;color:var(--c-mut)}
.seg{display:inline-flex;border:1px solid var(--c-line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 11px;min-height:32px;border-right:1px solid var(--c-line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--c-ink);color:#fff}
.tbtn{border:1px solid var(--c-line);background:#fff;border-radius:6px;padding:6px 11px;min-height:32px}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn.primary{background:var(--c-acc);color:var(--c-acc-ink);border-color:var(--c-acc)}
.saved{font-size:12px;color:var(--c-mut);min-width:96px}
.app{flex:1;display:grid;grid-template-columns:268px minmax(0,1fr) 288px;min-height:0}
.side{background:var(--c-panel);overflow:auto;padding:14px;border-right:1px solid var(--c-line)}
.side.right{border-right:0;border-left:1px solid var(--c-line)}
.side h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-mut);margin:18px 0 8px;font-weight:600}
.side h2:first-child{margin-top:0}
.row{display:flex;gap:6px;align-items:center}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.item{display:flex;align-items:center;gap:6px;border:1px solid var(--c-line);border-radius:6px;padding:6px 8px;background:#fff;min-height:36px}
.item.sel{border-color:var(--c-ink);box-shadow:inset 0 0 0 1px var(--c-ink)}
.item .grip{cursor:grab;color:var(--c-mut);user-select:none}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:left;padding:4px 0}
.item.off .nm{opacity:.45;text-decoration:line-through}
.item.drop{border-color:var(--c-acc);background:#eef5f1}
.ib{border:0;background:transparent;border-radius:4px;width:28px;height:28px;color:var(--c-mut);font-size:13px}
.ib:hover{background:#eee}
.badge{font-size:12px;color:var(--c-acc);border:1px solid #bcd3c7;background:#eef5f1;border-radius:4px;padding:0 6px}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.addgrid button{border:1px dashed #b9b5ab;background:#fff;border-radius:6px;padding:8px;text-align:left;min-height:38px}
.addgrid button:hover{border-style:solid;border-color:var(--c-ink)}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label,.field .lbl{font-size:12px;color:var(--c-mut);font-weight:500}
.field input[type=text]{border:1px solid var(--c-line);border-radius:6px;padding:7px 9px;min-height:34px;width:100%}
.field select{border:1px solid var(--c-line);border-radius:6px;padding:7px 9px;min-height:34px;background:#fff;width:100%}
.field .seg{display:flex}.field .seg button{flex:1;padding:6px 4px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--c-line);padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--c-ink)}
input[type=color]{width:44px;height:30px;border:1px solid var(--c-line);border-radius:6px;padding:2px;background:#fff}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl button{border:1px solid var(--c-line);border-radius:6px;background:#fff;padding:0;overflow:hidden;text-align:left}
.tpl button[aria-pressed=true]{outline:2px solid var(--c-ink)}
.tpl .th{height:54px;display:grid;grid-template-rows:1fr 1fr}
.tpl .nmx{padding:6px 8px;font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--c-mut);margin:6px 0 12px}
.live{font-size:12px;border-left:3px solid var(--c-acc);padding:4px 8px;background:#eef5f1;margin:0 0 12px}
.stage{min-width:0;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start;background:#e9e7e2}
.frame{width:100%;max-width:100%;background:#fff;border:1px solid var(--c-line);box-shadow:0 1px 2px rgba(0,0,0,.08);transition:width .25s ease}
.empty{padding:20px;color:var(--c-mut);font-size:13px}
.grp{border:1px solid var(--c-line);border-radius:6px;padding:10px;margin-bottom:12px;background:#fbfaf7}
.grp .field:last-child{margin-bottom:0}
.grp2{border-top:1px solid var(--c-line);margin-top:6px;padding-top:10px}
.grp2 summary{cursor:pointer;font-weight:600;margin-bottom:10px;min-height:32px;display:flex;align-items:center}
.linkf select,.linkf input{margin-top:0}
.linkf{gap:6px}
.linkf.warn label{color:#9a6a00}
.linkrow{list-style:none;border:1px solid var(--c-line);border-radius:6px;padding:10px;background:#fbfaf7}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--c-ink)}
.chk input{margin-top:3px}
.field input[type=text]{min-width:0}
#picker{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
#picker.on{display:flex}
#picker .box{background:#fff;border-radius:8px;max-width:880px;width:100%;max-height:88vh;overflow:auto;padding:18px}
#picker h3{margin:0 0 4px;font-size:18px}
#picker .sub{color:var(--c-mut);margin:0 0 14px;font-size:13px}
#picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#picker-grid button{text-align:left;border:1px solid var(--c-line);background:#fff;border-radius:6px;padding:10px;display:grid;gap:6px;align-content:start}
#picker-grid button:hover,#picker-grid button:focus-visible{border-color:var(--c-ink);outline:none;box-shadow:inset 0 0 0 1px var(--c-ink)}
#picker-grid svg{width:100%;height:auto;background:#f1efe9;border-radius:4px;fill:#9a968c}
#picker-grid svg .l{fill:#d3cfc4}#picker-grid svg .l2{fill:#f1efe9}#picker-grid svg .d{fill:#1c1b19}
#picker-grid b{font-weight:600}
#picker-grid span{font-size:12px;color:var(--c-mut);line-height:1.4}
#fmt{position:fixed;z-index:60;display:none;background:#1c1b19;border-radius:6px;padding:4px;gap:2px;box-shadow:0 4px 14px rgba(0,0,0,.3);align-items:center}
#fmt.on{display:flex}
#fmt button{border:0;background:transparent;color:#fff;min-height:32px;min-width:34px;padding:0 9px;border-radius:4px;font:500 13px "Instrument Sans",sans-serif}
#fmt button:hover{background:#3a3835}
#fmt .linkbox{display:none;gap:4px;align-items:center}
#fmt.linking .tools{display:none}
#fmt.linking .linkbox{display:flex}
#fmt input{min-height:32px;border:0;border-radius:4px;padding:0 8px;width:200px;font:13px "Instrument Sans",sans-serif}
.menued{gap:8px}
.mrow{border:1px solid var(--c-line);border-radius:6px;padding:6px 8px;background:#fff;display:grid;gap:6px}
.mrow input{border:1px solid var(--c-line);border-radius:6px;padding:6px 8px;min-height:32px;width:100%;font-size:13px}
.feats{gap:6px}
.feat{border:1px solid var(--c-line);border-radius:6px;padding:8px 10px;background:#fff}
.feat .chk{align-items:flex-start}
.feat small{display:block;color:var(--c-mut);font-size:12px;line-height:1.4;margin-top:2px}
.feat small.cnt{color:var(--c-acc)}
.feat.off{opacity:.55}
.addgrid button[disabled],#picker-grid button[disabled]{opacity:.45;cursor:not-allowed;border-style:solid}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--c-ink);color:#fff;padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:#fff;text-decoration:underline;padding:0;font-weight:600}
@media(max-width:1100px){.app{grid-template-columns:230px minmax(0,1fr) 250px}}
@media(max-width:860px){body{overflow:auto}.app{display:block}.side{border:0;border-bottom:1px solid var(--c-line)}.stage{padding:10px}}

/* ───────── The visitor's site: everything is driven by tokens ───────── */
.site{container-type:inline-size;container-name:site;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;position:relative;
  --r:0px;--bg:#fbfaf6;--ink:#1d211e;--mut:#5d655f;--line:#dcd9cf}
.site *{box-sizing:border-box}
.site h1,.site h2,.site h3{font-family:var(--fd);margin:0;line-height:1.12;letter-spacing:-.01em;font-weight:var(--fw,600)}
.site p{margin:0}
.site a:not(.btn){color:inherit}
.site [contenteditable]{outline:none;cursor:text;border-radius:2px}
.site [contenteditable]:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--p) 35%,transparent)}
.site [contenteditable]:focus{box-shadow:0 0 0 2px var(--p)}
.hdr{display:flex;align-items:center;gap:20px;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;flex-wrap:nowrap}
.logo{flex:0 1 auto;max-width:44%;display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:var(--fw,600);font-size:19px;min-width:0}
.lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mark{width:34px;height:34px;background:var(--p);color:var(--on-p);display:grid;place-items:center;border-radius:var(--r);font-size:16px;flex:none}
.menu{display:flex;gap:4px;margin-left:auto;align-items:center;flex:1;justify-content:flex-end;min-width:0}
.mitems{display:flex;gap:4px;align-items:center;min-width:0}
.mi{position:relative;flex:none}
.mi>button,.mi>.mg{white-space:nowrap;max-width:22ch;overflow:hidden;text-overflow:ellipsis}
.mg::after{content:"";display:inline-block;border:4px solid transparent;border-top-color:currentColor;border-bottom-width:0;margin-left:7px;vertical-align:2px}
.mpop{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:210px;max-width:300px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 28px rgba(0,0,0,.16);padding:6px;z-index:40}
.mgroup>.mpop{right:auto;left:0}
.mi.open>.mpop{display:block}
.mpop button{display:block;width:100%;text-align:left;white-space:normal;padding:10px 12px}
.mpop .mh{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:8px 12px 2px}
.menu .mi.open>.mg{background:var(--tint)}
.menu button{background:none;border:0;padding:8px 10px;border-radius:var(--r);color:var(--ink);font-size:15px}
.menu button.on{box-shadow:inset 0 -2px 0 var(--p)}
.menu button:hover{background-color:var(--tint)}
.menu .signin{background:var(--p);color:var(--on-p);margin-left:8px;white-space:nowrap;flex:none}
.nav-toggle{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;color:var(--ink)}
.sec{position:relative;padding:var(--sp,72px) 32px;background:var(--bg)}
.sec.sp-c{--sp:44px}.sec.sp-n{--sp:72px}.sec.sp-r{--sp:110px}
.sec.bg-tint{background:var(--tint)}
.sec.bg-brand{background:var(--p);color:var(--on-p);--line:color-mix(in srgb,var(--on-p) 28%,transparent);--mut:color-mix(in srgb,var(--on-p) 78%,transparent)}
.sec.bg-brand .btn{background:var(--on-p);color:var(--p);border-color:var(--on-p)}
.sec.bg-brand .btn.ghost{background:transparent;color:var(--on-p)}
.sec.selected{outline:2px solid #2f6fed;outline-offset:-2px}
.sec .tag{display:none;position:absolute;left:0;top:0;z-index:5;background:#2f6fed;color:#fff;font:600 12px/1 "Instrument Sans",sans-serif;padding:5px 8px;pointer-events:none}
.sec:hover .tag,.sec.selected .tag{display:block}
.sec.hidden{display:none}
.tb{display:none;position:absolute;right:10px;top:10px;z-index:8;gap:4px;background:#fff;border:1px solid #cfcbc2;border-radius:6px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sec.selected>.tb{display:flex}
.tb button{border:0;background:transparent;color:#1c1b19;font:500 13px "Instrument Sans",sans-serif;padding:6px 9px;min-height:32px;border-radius:4px}
.tb button:hover{background:#eee}
.tb button.danger{color:#a3261c}
.rm{position:absolute;right:8px;top:8px;z-index:4;border:0;border-radius:4px;background:rgba(20,20,20,.7);color:#fff;font:500 12px "Instrument Sans",sans-serif;padding:6px 9px;min-height:30px;opacity:0;transition:opacity .15s}
.img:hover>.rm,.rm:focus{opacity:1}
.hero-full .tb{top:60px}
.hdr.overlay ~ .hero-full .pick{top:84px}
.hdr.overlay ~ .hero-full .tb{top:130px}
.logo img{height:36px;width:auto;max-width:180px;object-fit:contain;display:block}
.hdr.sticky{position:sticky;top:0;z-index:30}
.hdr.overlay{position:absolute;top:0;left:0;right:0;background:transparent;border-bottom-color:rgba(255,255,255,.28);z-index:10;color:#fff}
.hdr.overlay .menu button:not(.signin),.hdr.overlay .logo,.hdr.overlay .nav-toggle{color:#fff}
.hdr.overlay .mpop button{color:var(--ink)}
.hdr.overlay .mpop button.on{box-shadow:inset 3px 0 0 var(--p)}
.hdr.overlay .nav-toggle{border-color:rgba(255,255,255,.55)}
.hdr.overlay.open{background:rgba(10,10,10,.88)}
.ins{height:0;position:relative;z-index:7}
.ins::before{content:"";position:absolute;left:0;right:0;top:-14px;height:28px}
.ins button{position:absolute;left:50%;top:-15px;transform:translateX(-50%);opacity:0;pointer-events:none;border:0;background:#2f6fed;color:#fff;font:600 13px "Instrument Sans",sans-serif;padding:0 14px;min-height:30px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:opacity .12s}
.ins:hover button,.ins button:focus-visible{opacity:1;pointer-events:auto}
.ins::after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:#2f6fed;opacity:0;pointer-events:none}
.ins:hover::after{opacity:.55}
/* Footer: its own surface, columns grouped by purpose, real contact links, legal row */
.ft{--fbg:color-mix(in srgb,var(--p) 22%,#0c0f0d);--fink:#f3f1ea;--fmut:color-mix(in srgb,var(--fink) 72%,transparent);--fline:color-mix(in srgb,var(--fink) 18%,transparent);
  background:var(--fbg);color:var(--fink);padding:64px 32px 28px;font-size:15px}
.ft.brand{--fbg:var(--p);--fink:var(--on-p)}
.ft.light{--fbg:var(--tint);--fink:var(--ink)}
.ft .wrap{max-width:1120px}
.ftgrid{display:grid;grid-template-columns:var(--ftw);gap:40px 40px}
.fbrand .logo{color:var(--fink);margin-bottom:14px;max-width:none}
.fbrand .lname{white-space:normal}
.ft .mark{background:var(--fink);color:var(--fbg)}
.flogo{display:inline-block;background:#fff;border-radius:var(--r);padding:8px 12px;margin-bottom:14px}
.flogo img{height:34px;width:auto;max-width:180px;object-fit:contain;display:block}
.fbrand p{color:var(--fmut);max-width:38ch}
.fcta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.ft .btn{background:var(--fink);color:var(--fbg);border-color:var(--fink);min-height:42px}
.ft .btn.ghost{background:transparent;color:var(--fink);border-color:var(--fline)}
.fsoc{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.fsoc a{border:1px solid var(--fline);padding:8px 14px;border-radius:var(--r);font-size:14px;text-decoration:none;min-height:38px;display:inline-flex;align-items:center}
.fsoc a:hover{background:color-mix(in srgb,var(--fink) 10%,transparent)}
.fth{font:600 12px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--fmut);margin-bottom:14px}
.fcol nav{display:grid;justify-items:start}
.fcol nav button{background:none;border:0;color:var(--fink);font:inherit;padding:7px 0;min-height:36px;text-align:left;cursor:pointer}
.fcol nav button:hover,.fcol a:hover{text-decoration:underline;text-underline-offset:3px}
.fcol address{font-style:normal;display:grid;gap:4px}
.fcol address a,.fcol address p{overflow-wrap:anywhere}
.fcol address a[title*="Calls"]{white-space:nowrap}
.fcol address a{color:var(--fink);padding:6px 0;min-height:36px;display:flex;align-items:center;width:fit-content;cursor:pointer}
.fcol address p{margin:0 0 6px;color:var(--fink)}
.legal{margin-top:48px;padding-top:20px;border-top:1px solid var(--fline);display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;font-size:13px;color:var(--fmut)}
.legal nav{display:flex;gap:4px 18px;flex-wrap:wrap}
.legal button{background:none;border:0;color:var(--fmut);font:inherit;padding:6px 0;min-height:32px;cursor:pointer}
.legal button:hover{color:var(--fink);text-decoration:underline;text-underline-offset:3px}
.legal .credit{opacity:.9}
.site.stickyhdr .sec{scroll-margin-top:84px}
.item.secrow{display:block;padding:6px 8px}
.secrow .r1{display:flex;align-items:center;gap:6px;min-height:30px}
.secrow .r2{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 2px 20px;min-height:28px}
.secrow .mchk{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{border:0;background:none;color:var(--c-mut);text-decoration:underline;font-size:12px;padding:4px}
.mchk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--c-mut);white-space:nowrap;cursor:pointer}
.mchk input{margin:0}
.sec.featoff{opacity:.42}
.sec.featoff::before{content:attr(data-off);position:absolute;left:0;right:0;top:0;z-index:6;background:#fbf3df;color:#6a4700;font:500 13px "Instrument Sans",sans-serif;padding:7px 12px;text-align:center;pointer-events:none}
.price{display:inline-block;margin-top:10px;font:var(--fw,600) 18px var(--fd);color:var(--ink)}
.card .price{margin-top:12px}
.bar{height:8px;background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:var(--r);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--p)}
.amt{font-size:14px;margin-top:8px}
.prod .img{aspect-ratio:1;border-radius:0;cursor:default;min-height:0}
.bal.cards.prod{--m:4;--cap:300px}
.rowlist article{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.rowlist article:last-child{border-bottom:1px solid var(--line)}
.rowlist h3{font-size:20px}
.rowlist p{color:var(--mut);font-size:15px}
.btn.nolink{outline:2px dashed #d99a00;outline-offset:3px}
.rich{outline:none}
.rich ul{margin:8px 0;padding-left:1.25em}
.rich a{text-decoration:underline;text-underline-offset:3px}
.rich b{font-weight:700}
.ans{color:var(--mut);margin-top:10px}
.ctext{color:var(--mut);font-size:15px;margin-top:6px}
.card.cardimg,.card .cardimg{aspect-ratio:3/2;border-radius:0}
.card .img[data-img]{cursor:pointer}
.card .num{display:block;font:var(--fw,600) 32px/1 var(--fd);color:var(--p);margin-bottom:12px}
.card .b{display:flex;flex-direction:column;flex:1}
.card{display:flex;flex-direction:column}
.card .btns{margin-top:auto;padding-top:14px}
.card .itx{align-self:flex-start}
.itx{display:none;border:1px solid #cfcbc2;background:#fff;color:#a3261c;border-radius:4px;font:500 12px "Instrument Sans",sans-serif;padding:6px 9px;min-height:30px;margin-top:10px}
.sec.selected .itx{display:inline-flex}
.cell{position:relative;display:grid}
.cell .img{aspect-ratio:1}
.cell .itx{position:absolute;left:8px;top:8px;margin:0;z-index:4}

  if(d.rmitem){ const {s}=findSec(t.dataset.sec||S.sel); if(!s)return; remember(); const i=s.items.findIndex(x=>x.id===d.rmitem); if(i>=0){ delete s.imgs["i"+d.rmitem]; s.items.splice(i,1); } morph(renderAll); toast(`Removed. ${s.items.length} left.`,"Undo",()=>$("#undo").click()); return; }
  if(d.moveitem){ const [iid,dir]=d.moveitem.split(":"); const {s}=findSec(S.sel); const i=s.items.findIndex(x=>x.id===iid),j=i+ +dir; if(i>=0&&j>=0&&j<s.items.length){ remember(); const [m]=s.items.splice(i,1); s.items.splice(j,0,m); morph(renderAll); } return; }
  if(d.btnb1||d.btnb2){ const k=d.btnb1?"b1":"b2"; const want=d["btn"+k]; const {s}=findSec(S.sel); remember(); s.props[k]=want==="off"?"":(k==="b1"?(s.type==="hero"?"Join the community":"Join now"):"See what is on"); renderAll(); return; }
  if(d.eye){ remember(); const {s}=findSec(d.eye); s.hidden=!s.hidden; morph(renderAll); return; }
  if(d.add){ remember(); const s=mk(d.add,null,{...(COPY[d.add]||{heading:BLOCKS[d.add].name})}); curPage().sections.push(s); S.sel=s.id; renderAll(); document.querySelector(`[data-block="${s.id}"]`)?.scrollIntoView({block:"center"}); return; }
  if(d.tpl){ if(S.template===d.tpl)return; remember(); const t=TEMPLATES[d.tpl]; S.template=d.tpl; S.primary=t.p; S.font=t.font; S.corners=t.r; S.dark=t.dark; renderAll(); toast("Look applied. Your sections and words stayed."); return; }
  if(d.tplreset!==undefined){ if(!confirm("Replace your sections with this template's starting layout? Your words and photos in them will be lost. You can undo."))return; remember(); const t=TEMPLATES[S.template]; curPage().sections=ensureSections(t.home()); S.sel=null; renderAll(); toast("Started over with the "+t.name+" layout.","Undo",()=>$("#undo").click()); return; }
  if(d.color){ remember(); S.primary=d.color; renderAll(); return; }
  if(d.hdr){ remember(); S.hdr=d.hdr; renderAll(); return; }
  if(d.fstyle){ remember(); S.foot.style=d.fstyle; renderAll(); return; }
  if(d.top!==undefined){ document.querySelector(".stage").scrollTo({top:0,behavior:"smooth"}); return; }
  if(d.variant||d.bg||d.space||d.count||d.corners!==undefined||d.dark!==undefined){
    remember();
    const {s}=findSec(S.sel);
    if(d.variant)s.variant=d.variant; if(d.bg)s.bg=d.bg; if(d.space)s.space=d.space; if(d.count)s.count=+d.count;
    if(d.corners!==undefined)S.corners=d.corners; if(d.dark!==undefined)S.dark=d.dark==="true";
    renderAll(); return; }
  if(d.move!==undefined){ remember(); const {s,p}=findSec(S.sel); const i=p.sections.indexOf(s),j=i+ +d.move; if(j>=0&&j<p.sections.length){ p.sections.splice(i,1); p.sections.splice(j,0,s);} morph(renderAll); return; }
  if(d.dup!==undefined){ remember(); const {s,p}=findSec(S.sel); const c=JSON.parse(JSON.stringify(s)); c.id=id(); if(c.items){ const imgs={}; c.items.forEach(it=>{ const old=it.id; it.id=id(); if(s.imgs["i"+old]) imgs["i"+it.id]=s.imgs["i"+old]; }); Object.keys(c.imgs).filter(k=>/^i/.test(k)).forEach(k=>delete c.imgs[k]); Object.assign(c.imgs,imgs); } p.sections.splice(p.sections.indexOf(s)+1,0,c); S.sel=c.id; renderAll(); return; }
  if(d.del!==undefined){ removeSection(S.sel); return; }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.matches("[data-edit]")){ const {s}=findSec(t.dataset.sec); if(!s)return; if(!t._rem){ remember(); t._rem=true; } const val=t.dataset.rich!==undefined?clean(t.innerHTML):t.innerText; if(t.dataset.item){ const it=s.items.find(x=>x.id===t.dataset.item); if(it)it[t.dataset.edit]=val; } else s.props[t.dataset.edit]=val; touch(); }
  if(t.dataset.linkv!==undefined&&t.tagName==="INPUT"){ const o=linkOwner(t.dataset.linkv); if(!t._rem){ remember(); t._rem=true; } o.owner.links[o.key]={...getLink(o.owner,o.key),v:t.value}; touch(); renderSite(); }
  if(t.dataset.menulabel){ const {s}=findSec(t.dataset.menulabel); if(!t._rem){ remember(); t._rem=true; } s.menu.label=t.value; touch(); renderSite(); }
  if(t.dataset.foot){ if(!t._rem){ remember(); t._rem=true; } S.foot[t.dataset.foot]=t.value; touch(); renderSite(); }
  if(t.dataset.social){ if(!t._rem){ remember(); t._rem=true; } S.foot.social[t.dataset.social]=t.value; touch(); renderSite(); }
  if(t.id==="nm"){ S.name=t.value; touch(); $$(".logo").forEach(l=>{l.querySelector(".mark").textContent=(S.name.trim()[0]||"G"); l.lastElementChild.textContent=S.name;}); $$(".ft > span").forEach(x=>x.textContent=S.name); }
  if(t.id==="pc"){ if(!t._rem){ remember(); t._rem=true; } S.primary=t.value; $("#site").setAttribute("style",tokens()); touch(); }
});
document.addEventListener("focusout",e=>{ if(e.target._rem)e.target._rem=false; });
function linkOwner(ref){ const [ownerId,key]=ref.split("|"); const [sid,iid]=ownerId.split(":"); const {s}=findSec(sid); const owner=iid?s.items.find(x=>x.id===iid):s; owner.links=owner.links||{}; return {owner,key}; }
document.addEventListener("toggle",e=>{ if(e.target.id==="hf") hfOpen=e.target.open; },true);
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.linkt){ const o=linkOwner(t.dataset.linkt); remember(); const kind=t.value; o.owner.links[o.key]={t:kind,v:kind==="anchor"?(curPage().sections.find(x=>x.menu&&x.menu.on)||curPage().sections[0]||{}).id:""}; renderRight(); renderSite(); return; }
  if(t.dataset.menuon){ const {s}=findSec(t.dataset.menuon); remember(); s.menu=s.menu||{label:BLOCKS[s.type].name}; s.menu.on=t.checked; renderAll(); return; }
  if(t.dataset.linkv!==undefined&&t.tagName==="SELECT"){ const o=linkOwner(t.dataset.linkv); remember(); o.owner.links[o.key]={...getLink(o.owner,o.key),v:t.value}; renderRight(); renderSite(); return; }
  if(t.dataset.cardbtn){ const {s}=findSec(S.sel); const it=s.items.find(x=>x.id===t.dataset.cardbtn); remember(); it.btn=t.checked?"Learn more":""; renderAll(); return; }
  if(t.dataset.feat){ remember(); const k=t.dataset.feat; S.features[k]=t.checked; renderAll(); const secs=S.pages.reduce((a,p)=>a+p.sections.filter(x=>featOfSec(x)===k).length,0); toast(t.checked?`${featName(k)} is now on your website: ${secs} section${secs===1?"":"s"}, and in the menu where you ticked it.`:`${featName(k)} is hidden from visitors. Your edits are kept.`,"Undo",()=>$("#undo").click()); return; }
  if(t.id==="sticky"){ remember(); S.sticky=t.checked; renderSite(); return; }
  if(t.id==="f-credit"){ remember(); S.foot.credit=t.checked; renderSite(); return; }
  if(t.id==="f-menu"){ remember(); S.foot.menu=t.checked; renderSite(); return; }
  if(e.target.id==="font"){ remember(); S.font=e.target.value; renderAll(); }
  if(e.target.id==="pc"){ renderAll(); }
});
function morph(fn){ if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches) { const vt=document.startViewTransition(fn); [vt.ready,vt.finished,vt.updateCallbackDone].forEach(x=>x&&x.catch(()=>{})); } else fn(); }
function removeSection(sid){ const {s,p}=findSec(sid); if(!s)return; remember(); p.sections.splice(p.sections.indexOf(s),1); if(S.sel===sid)S.sel=null; morph(renderAll); toast(`“${BLOCKS[s.type].name}” removed.`,"Undo",()=>$("#undo").click()); }
document.addEventListener("keydown",e=>{ if((e.key==="Delete"||e.key==="Backspace")&&S.sel&&!e.target.closest("[contenteditable],input,select,textarea")){ e.preventDefault(); removeSection(S.sel); } });
document.addEventListener("paste",e=>{ const t=e.target.closest?.("[contenteditable]"); if(!t)return; e.preventDefault(); const txt=(e.clipboardData||window.clipboardData).getData("text/plain"); document.execCommand("insertText",false,t.dataset.rich!==undefined?txt:txt.replace(/\n+/g," ")); });
/* the picker that opens from the + between sections */
let insertAt=0;
function openPicker(i){ insertAt=i; const g=$("#picker-grid"); g.innerHTML=Object.entries(BLOCKS).map(([k,b])=>{ const off=!isOn(b.feature); return `<button data-newtype="${k}" ${off?"disabled":""}><svg viewBox="0 0 120 62" aria-hidden="true">${WIRE[k]||""}</svg><b>${b.name}${b.live?' <span class="badge">live</span>':""}</b><span>${off?`Switched off. Turn on ${featName(b.feature)} under Features on your website first.`:(BLOCK_DESC[k]||"")}</span></button>`; }).join(""); $("#picker").classList.add("on"); g.querySelector("button:not([disabled])").focus(); }
function closePicker(){ $("#picker").classList.remove("on"); }
$("#picker").addEventListener("click",e=>{ const b=e.target.closest("[data-newtype]"); if(b){ const type=b.dataset.newtype; remember(); const sec=mk(type,null,{...(COPY[type]||{heading:BLOCKS[type].name})}); curPage().sections.splice(insertAt,0,sec); S.sel=sec.id; closePicker(); morph(renderAll); setTimeout(()=>document.querySelector(`[data-block="${sec.id}"]`)?.scrollIntoView({block:"center"}),60); return; } if(e.target.id==="picker"||e.target.closest("[data-closepicker]")) closePicker(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closePicker(); hideFmt(); const open=document.querySelector(".mi.open .mg"); closeMenus(); open?.focus(); } });
/* text toolbar: appears when words in a paragraph are selected */
const fmt=()=>$("#fmt"); let fmtRoot=null,fmtRange=null;
function hideFmt(){ fmt().classList.remove("on"); fmt().classList.remove("linking"); }
document.addEventListener("selectionchange",()=>{
  const sel=getSelection(); if(!sel.rangeCount||sel.isCollapsed){ if(!fmt().classList.contains("linking")) hideFmt(); return; }
  const node=sel.anchorNode&&(sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement); const root=node&&node.closest("[data-rich]");
  if(!root||!root.contains(sel.focusNode)){ if(!fmt().classList.contains("linking")) hideFmt(); return; }
  fmtRoot=root; const r=sel.getRangeAt(0).getBoundingClientRect(); const f=fmt(); f.classList.add("on");
  const w=f.offsetWidth; f.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+"px"; f.style.top=Math.max(8,r.top-f.offsetHeight-8)+"px";
});
fmt().addEventListener("mousedown",e=>{ if(e.target.tagName!=="INPUT") e.preventDefault(); });
fmt().addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||!fmtRoot)return; const c=b.dataset.cmd;
  const done=()=>fmtRoot.dispatchEvent(new Event("input",{bubbles:true}));
  if(c==="bold"||c==="italic"||c==="insertUnorderedList"){ document.execCommand(c); done(); }
  else if(c==="unlink"){ document.execCommand("unlink"); done(); }
  else if(c==="link"){ fmtRange=getSelection().getRangeAt(0).cloneRange(); fmt().classList.add("linking"); $("#fmt-url").value=""; $("#fmt-url").focus(); }
  else if(c==="apply"){ const u=safeUrl($("#fmt-url").value); if(!u){ toast("Type a web address, an email (mailto:…) or a phone number (tel:…)."); return; } const sel=getSelection(); sel.removeAllRanges(); sel.addRange(fmtRange); document.execCommand("createLink",false,u); fmt().classList.remove("linking"); done(); }
  else if(c==="cancel"){ fmt().classList.remove("linking"); }
});
$("#fmt-url").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); fmt().querySelector('[data-cmd="apply"]').click(); } });
/* drag to reorder */
let dragId=null;
document.addEventListener("dragstart",e=>{ const li=e.target.closest?.("[data-sid]"); if(!li)return; dragId=li.dataset.sid; e.dataTransfer.effectAllowed="move"; });
document.addEventListener("dragover",e=>{ const li=e.target.closest?.("[data-sid]"); if(!li||!dragId)return; e.preventDefault(); $$(".item.drop").forEach(x=>x.classList.remove("drop")); li.classList.add("drop"); });
document.addEventListener("drop",e=>{ const li=e.target.closest?.("[data-sid]"); if(!li||!dragId)return; e.preventDefault(); const p=curPage(); const from=p.sections.findIndex(s=>s.id===dragId),to=p.sections.findIndex(s=>s.id===li.dataset.sid); if(from!==to){ remember(); const [m]=p.sections.splice(from,1); p.sections.splice(to,0,m); } dragId=null; morph(renderAll); });
document.addEventListener("dragend",()=>{ dragId=null; $$(".item.drop").forEach(x=>x.classList.remove("drop")); });
/* device preview */
$("#device").onclick=e=>{ const b=e.target.closest("button"); if(!b)return; $$("#device button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); $("#frame").style.width=b.dataset.w; };
$("#publish").onclick=()=>toast("In the app this checks the page for problems, then makes it live in about a second.");
let toastT,toastFn; function toast(m,label,fn){ $("#toast-t").textContent=m; const a=$("#toast-a"); a.hidden=!label; a.textContent=label||""; toastFn=fn; $("#toast").classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>$("#toast").classList.remove("on"),label?6000:3200); }
$("#toast-a").onclick=()=>{ toastFn&&toastFn(); $("#toast").classList.remove("on"); };

renderAll(); touch(true);
</script>
