# =============================================================================
# Security headers for Next.js frontend origins — member, institution, and
# platform portals. `include` this inside every server{} block that proxies
# to one of those (the /api/ location nested inside the same server block
# inherits it too — that's fine, a browser-oriented CSP on a JSON response is
# inert, not harmful).
#
# nginx gotcha: add_header is only inherited from a parent context (http{})
# if the current context (server{}/location{}) defines NO add_header of its
# own. The moment a server block adds even one, ALL http-level add_header
# lines are silently dropped for it — so this file repeats the full set
# rather than layering on top of nginx.conf's http-level ones.
#
# CSP notes:
#   - script-src/style-src need 'unsafe-inline': Next.js App Router emits
#     inline <script> tags for RSC hydration payloads, and this codebase uses
#     styled-jsx (<style jsx>) for a few animations — neither is nonce'd.
#     Blocking inline entirely needs a per-request nonce wired through
#     middleware in each Next app; this is the pragmatic first pass without
#     app code changes. It still blocks the most common XSS vector: loading
#     an attacker-controlled *external* script.
#   - https://accounts.google.com is allowed for the member portal's Google
#     Sign-In (Google Identity Services, see app/google-auth/page.tsx).
#     Harmless to also allow on institution/platform, which don't use it.
#     style-src needs it too — the GIS SDK injects its own <link>/<style> for
#     the rendered button (https://accounts.google.com/gsi/style); without
#     it the button silently renders unstyled (a CSP violation, not a
#     script error, so it's easy to miss in testing).
#   - connect-src needs YOUR_WILDCARD_DOMAIN below (e.g. https://*.alumunion.com)
#     — REPLACE THIS before deploying. The Google sign-in bridge
#     (app/google-auth/page.tsx) always runs on the fixed base domain (the
#     one origin actually registered with Google) and, by design, fetches
#     cross-origin to whichever institution subdomain sent the visitor there
#     (see its own doc comment: "exchanges the resulting ID token with the
#     tenant's own API"). That's a different origin from CSP's point of view
#     — 'self' does not cover sibling subdomains — so without this wildcard
#     every Google sign-in fails at the fetch with "Refused to connect to
#     https://<slug>.yourdomain/api/v1/auth/google because it does not
#     appear in the connect-src directive", surfacing to the user as a
#     generic "Could not reach the server" error.
#   - img-src allows any https: origin — institution admins configure their
#     own logo/icon URLs (theme.logoUrl/iconUrl), rendered via plain <img>,
#     not just the CDN — and the alumni map's OpenStreetMap tiles come from
#     {a,b,c}.tile.openstreetmap.org.
# =============================================================================
add_header X-Frame-Options        "SAMEORIGIN"                       always;
add_header X-Content-Type-Options "nosniff"                          always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://*.yourplatform.example; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
