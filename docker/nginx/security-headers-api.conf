# =============================================================================
# Security headers for standalone JSON API origins (e.g. alumat-api.*,
# admin-alumat-api.*). Application responses are JSON and unaffected by CSP —
# this is defense-in-depth for the one thing that IS real HTML here: Swagger
# UI, which some of these APIs can serve outside Development via an
# `enableSwagger` flag (see Program.cs in each *.Api project). Worth
# confirming that flag is off in production if you don't want Swagger public.
#
# Not included in the same-origin "/api/" location nested inside a frontend
# server block — that block already gets security-headers-app.conf at the
# server level, and add_header only applies once per context anyway.
# =============================================================================
add_header X-Frame-Options        "DENY"                             always;
add_header X-Content-Type-Options "nosniff"                          always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
