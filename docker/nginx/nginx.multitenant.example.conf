# =============================================================================
# ReservEase Alumni Platform – Multi-tenant wildcard-subdomain example (INERT)
# =============================================================================
# This is a TEMPLATE, not live config — it is not referenced by
# docker-compose.yml / docker-compose.prod.yml and nginx never loads it.
# The live routing lives in nginx.conf / nginx.ip.conf / nginx.pre-ssl.conf,
# which continue to serve each currently-deployed institution's fixed hostnames unchanged.
#
# Adopt this once you have:
#   1. Registered a real platform domain (replace every `yourplatform.example`
#      below with it, and set PLATFORM_BASE_DOMAIN to the same value in .env).
#   2. Wildcard DNS: `*.yourplatform.example` and `*.member.yourplatform.example`
#      pointed at this server.
#   3. A wildcard TLS certificate for `*.yourplatform.example` (and the
#      `*.member.` one) — wildcard certs require DNS-01 validation (e.g.
#      certbot with a DNS plugin for your registrar), since HTTP-01 can't
#      prove control of a wildcard.
#
# Until all three exist, every request to Admin.Api/Member.Api falls back to
# `DefaultInstitutionSlug` (see appsettings.json / TenantResolutionMiddleware)
# regardless of Host header, so every currently-deployed institution keeps working exactly as it does today.
#
# Routing model once live — same-origin, no separate API subdomains:
#
#   <slug>.yourplatform.example            → frontend-institution:3000
#   <slug>.yourplatform.example/api/       → institution-api:8080 (same origin)
#   <slug>.member.yourplatform.example     → frontend-member:3000
#   <slug>.member.yourplatform.example/api/ → member-api:8080 (same origin)
#   platform.yourplatform.example          → frontend-platform:3000 (Platform Portal)
#   platform.yourplatform.example/api/     → platform-api:8080 (same origin)
#
# Each app's frontend calls its own "/api/v1/..." path on whatever host the
# browser is on (see apps/institution/member's src/lib/api-client.ts) — nginx
# forwards that path to the right backend while passing the original Host
# header through unchanged (global `proxy_set_header Host $host;` below),
# which is what TenantResolutionMiddleware reads to resolve the tenant. This
# also means the browser never makes a cross-origin request, so there's
# nothing to configure for CORS, and only one wildcard cert per app subdomain
# pattern is needed — no separate API wildcard subdomains to provision.
# =============================================================================

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    proxy_http_version    1.1;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      Upgrade           $http_upgrade;
    proxy_set_header      Connection        keep-alive;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ==========================================================================
    # HTTP → HTTPS redirect for every host under the platform domain
    # ==========================================================================
    server {
        listen 80;
        server_name *.yourplatform.example *.member.yourplatform.example
                    yourplatform.example;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # <slug>.yourplatform.example  –  Institution Portal + Admin API (per tenant)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name *.yourplatform.example;

        ssl_certificate     /etc/letsencrypt/live/yourplatform.example/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourplatform.example/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        location /api/ {
            proxy_pass http://institution-api:8080;
        }

        location / {
            proxy_pass http://frontend-institution:3000;
        }
    }

    # ==========================================================================
    # <slug>.member.yourplatform.example  –  Member Portal + Member API (per tenant)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name *.member.yourplatform.example;

        ssl_certificate     /etc/letsencrypt/live/yourplatform.example/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourplatform.example/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        location /api/ {
            proxy_pass http://member-api:8080;
        }

        location / {
            proxy_pass http://frontend-member:3000;
        }
    }

    # ==========================================================================
    # platform.yourplatform.example  –  Platform Portal + Platform API (operator UI)
    # ==========================================================================
    # Not tenant-scoped — this is the one app that legitimately stays on a
    # fixed, single hostname (operators manage every institution from here),
    # so NEXT_PUBLIC_PLATFORM_API_URL can keep pointing at a fixed origin
    # instead of using the same-origin pattern above. Routed same-origin here
    # too only for consistency / to avoid a separate wildcard cert.
    server {
        listen 443 ssl http2;
        server_name platform.yourplatform.example;

        ssl_certificate     /etc/letsencrypt/live/yourplatform.example/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourplatform.example/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        location /api/ {
            proxy_pass http://platform-api:8080;
        }

        location / {
            proxy_pass http://frontend-platform:3000;
        }
    }
}
