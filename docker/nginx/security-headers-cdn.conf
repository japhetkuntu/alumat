# =============================================================================
# Security headers for the public MinIO CDN (institution-uploaded photos,
# documents, certificates — untrusted content). default-src 'none' means
# that if someone navigates directly to an uploaded HTML or SVG file (SVGs
# can carry <script>), it can't execute as active content — <img>/<video>
# tags elsewhere embedding these files are unaffected, since CSP on a
# resource only governs that resource's own behavior when loaded as a
# document, not how other pages reference it.
# =============================================================================
add_header X-Frame-Options        "DENY"     always;
add_header X-Content-Type-Options "nosniff"  always;
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
