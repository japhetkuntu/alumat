# =============================================================================
# UMaT Alumni – Nginx Production Gateway (WILDCARD multi-tenant mode)
# =============================================================================
# Replaces nginx.conf's fixed single-institution hostnames with real
# per-institution subdomains, so every institution created in the Platform
# Portal gets a working portal automatically — no nginx change needed per
# institution. Same same-origin proxy pattern as nginx.conf (frontend calls
# "/api/v1/..." on its own host, nginx forwards Host unchanged, the API's
# TenantResolutionMiddleware reads it) — just wildcarded.
#
# Routing model:
#
#   {slug}.alumat.umat.edu.gh          → frontend-member:3000   (member portal)
#   {slug}.alumat.umat.edu.gh/api/     → member-api:8080        (same origin)
#   {slug}.admin.alumat.umat.edu.gh    → frontend-institution:3000 (institution portal)
#   {slug}.admin.alumat.umat.edu.gh/api/ → institution-api:8080 (same origin)
#   platform.alumat.umat.edu.gh        → frontend-platform:3000 (Platform Portal — staff only, not wildcarded)
#   platform.alumat.umat.edu.gh/api/   → platform-api:8080      (same origin)
#   cdn.alumat.umat.edu.gh             → minio:9000              (unchanged from nginx.conf)
#
# Prerequisites before switching NGINX_CONF_FILE to this file:
#   1. Wildcard DNS: `*.alumat.umat.edu.gh` AND `*.admin.alumat.umat.edu.gh`
#      both pointed at this server's IP (two separate wildcard A/AAAA records
#      — a wildcard only covers one label, so `*.alumat...` does NOT also
#      cover `*.admin.alumat...`). Plus a plain A record for
#      `platform.alumat.umat.edu.gh` (or fold it into one of the wildcards).
#   2. Two wildcard TLS certs — `*.alumat.umat.edu.gh` and
#      `*.admin.alumat.umat.edu.gh` — via DNS-01 validation (HTTP-01 cannot
#      prove control of a wildcard). With certbot: use a DNS plugin for your
#      registrar, e.g. `certbot certonly --dns-<provider> -d '*.alumat.umat.edu.gh' -d alumat.umat.edu.gh`
#      and the same for the admin. one. `platform.alumat.umat.edu.gh` can
#      ride on the same cert as one of the wildcards (add it as an extra -d).
#   3. Institution.Api's PlatformBaseDomain = "admin.alumat.umat.edu.gh" and
#      Member.Api's PlatformBaseDomain = "alumat.umat.edu.gh" — see
#      docker-compose.prod.yml (already wired from PLATFORM_BASE_DOMAIN).
#   4. Every institution needs a real Slug (already required at onboarding).
#
# Until all of this is live, keep using nginx.conf (or nginx.ip.conf) — this
# file is inert until NGINX_CONF_FILE points at it.
# =============================================================================

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml font/truetype font/opentype image/svg+xml;

    proxy_http_version    1.1;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      Upgrade           $http_upgrade;
    proxy_set_header      Connection        keep-alive;
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_buffer_size     4k;
    proxy_buffers         8 4k;

    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-XSS-Protection       "1; mode=block"                    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "geolocation=(), microphone=()"    always;

    # Docker embedded DNS — required so nginx re-resolves upstream container
    # names on restart instead of caching a stale IP.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ==========================================================================
    # HTTP → HTTPS redirect for every host under both wildcard domains
    # ==========================================================================
    server {
        listen 80;
        server_name *.alumat.umat.edu.gh *.admin.alumat.umat.edu.gh
                    alumat.umat.edu.gh platform.alumat.umat.edu.gh
                    cdn.alumat.umat.edu.gh;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # {slug}.alumat.umat.edu.gh  –  Member Portal (wildcard)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name *.alumat.umat.edu.gh alumat.umat.edu.gh;

        ssl_certificate     /etc/letsencrypt/live/alumat.umat.edu.gh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alumat.umat.edu.gh/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # Same-origin API proxy — see apps/member/src/lib/api-client.ts. Host
        # is forwarded unchanged (global proxy_set_header above), which is
        # what TenantResolutionMiddleware reads to resolve {slug}.
        location /api/ {
            proxy_pass http://member-api:8080;
        }

        location / {
            proxy_pass http://frontend-member:3000;
        }
    }

    # ==========================================================================
    # {slug}.admin.alumat.umat.edu.gh  –  Institution Portal (wildcard)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name *.admin.alumat.umat.edu.gh;

        ssl_certificate     /etc/letsencrypt/live/admin.alumat.umat.edu.gh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.alumat.umat.edu.gh/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        # Same-origin API proxy — see apps/institution/src/lib/api-client.ts.
        location /api/ {
            proxy_pass http://institution-api:8080;
        }

        location / {
            proxy_pass http://frontend-institution:3000;
        }
    }

    # ==========================================================================
    # platform.alumat.umat.edu.gh  –  Platform Portal (fixed, staff only)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name platform.alumat.umat.edu.gh;

        ssl_certificate     /etc/letsencrypt/live/alumat.umat.edu.gh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alumat.umat.edu.gh/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        location /api/ {
            proxy_pass http://platform-api:8080;
        }

        location / {
            proxy_pass http://frontend-platform:3000;
        }
    }

    # ==========================================================================
    # cdn.alumat.umat.edu.gh  –  MinIO CDN (public file serving)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name cdn.alumat.umat.edu.gh;

        ssl_certificate     /etc/letsencrypt/live/alumat.umat.edu.gh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alumat.umat.edu.gh/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        location / {
            proxy_pass http://minio:9000;
            proxy_set_header  Host $http_host;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header        Access-Control-Allow-Origin "*" always;
        }
    }

    # ==========================================================================
    # Default – redirect bare IP / unmatched host to the member portal
    # ==========================================================================
    server {
        listen 80 default_server;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://alumat.umat.edu.gh$request_uri;
        }
    }
}
