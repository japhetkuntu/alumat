<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{{title}}</title>
  <!--[if !mso]><!-->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!--<![endif]-->
  <style>
    body { margin: 0; padding: 0; background: #f5f3ee; color: #14181f; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
    table { border-collapse: collapse; }
    a { color: inherit; }
    .page { width: 100%; padding: 40px 20px 48px; }
    .email { width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid {{brand_color_light}}; border-radius: 20px; overflow: hidden; box-shadow: 0 14px 38px rgba(20,24,31,0.08); }
    .bar { height: 6px; background: linear-gradient(90deg, {{brand_color}}, {{brand_color_dark}}); }
    .email-header { padding: 26px 40px 4px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: #14181f; }
    .eyebrow-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{brand_color_dark}}; }
    .content { padding: 30px 40px 8px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 16px; background: {{brand_color_light}}; color: {{brand_color_dark}}; }
    h1 { margin: 0 0 16px; font-size: 24px; line-height: 1.28; letter-spacing: -0.01em; color: #14181f; font-weight: 800; }
    p { margin: 0 0 16px; font-size: 15px; line-height: 1.7; color: #4b5566; }
    .button { display: inline-block; padding: 15px 28px; background: {{brand_color}}; color: {{brand_text_on_color}} !important; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 15px; margin: 6px 0 22px; box-shadow: 0 8px 20px {{brand_color_soft}}; }
    .footer { padding: 24px 40px 30px; background: #f5f3ee; border-top: 1px solid {{brand_color_light}}; text-align: center; }
    .footer p { margin: 0; color: #8a93a3; font-size: 12px; line-height: 1.6; }
    .footer strong { color: #64748b; }
  </style>
</head>
<body>
  <main class="page">
    <div class="email">
      <div class="bar"></div>
      <div class="email-header">
        <div class="brand">{{brand_mark_html}}<span class="brand-name">{{brand_name}}</span></div>
        <span class="eyebrow-tag">Notification</span>
      </div>
      <div class="content">
        <span class="badge">{{badge_label}}</span>
        <h1>{{title}}</h1>
        <p>Hi {{first_name}},</p>
        <p>{{body}}</p>
        <a href="{{action_url}}" class="button">{{action_label}}</a>
      </div>
      <div class="footer">
        <p>You're receiving this because you have <strong>{{pref_label}}</strong> enabled in your account settings.</p>
      </div>
    </div>
  </main>
</body>
</html>
