<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f4; margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
    .bar { height: 5px; background: linear-gradient(90deg, {{brand_color}}, {{brand_color_dark}}); }
    .wrapper { max-width: 560px; margin: 0 auto; padding: 44px 20px; }
    .card { background: #ffffff; border-radius: 18px; padding: 44px 40px; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 20px 48px rgba(15,23,42,0.08); }
    .mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, {{brand_color}}, {{brand_color_dark}}); color: #ffffff; font-size: 18px; font-weight: 800; text-align: center; line-height: 44px; margin-bottom: 18px; }
    .brand { font-size: 12.5px; font-weight: 700; letter-spacing: 1.6px; color: {{brand_color_dark}}; text-transform: uppercase; margin: 0 0 18px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 16px; background: {{brand_color_light}}; color: {{brand_color_dark}}; }
    h1 { font-size: 21px; color: #0f172a; margin: 0 0 14px; line-height: 1.3; letter-spacing: -0.2px; }
    p { font-size: 15px; line-height: 1.7; color: #475569; margin: 0 0 16px; }
    .cta { display: inline-block; margin: 8px 0 22px; padding: 14px 28px; background: {{brand_color}}; color: {{brand_text_on_color}} !important; text-decoration: none; font-size: 14.5px; font-weight: 700; border-radius: 12px; box-shadow: 0 8px 20px {{brand_color_soft}}; }
    .footer { margin-top: 34px; padding-top: 24px; border-top: 1px solid #eef2f1; color: #94a3b8; font-size: 12.5px; line-height: 1.6; }
    .footer strong { color: #64748b; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="wrapper">
    <div class="card">
      {{brand_mark_html}}
      <div class="brand">{{brand_name}}</div>
      <span class="badge">{{badge_label}}</span>
      <h1>{{title}}</h1>
      <p>Hi {{first_name}},</p>
      <p>{{body}}</p>
      <a href="{{action_url}}" class="cta">{{action_label}}</a>
      <div class="footer">
        You're receiving this because you have <strong>{{pref_label}}</strong> enabled in your account settings.
      </div>
    </div>
  </div>
</body>
</html>
