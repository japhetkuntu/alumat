# Netlify site config for the Platform Portal (@alumni/platform).
# Create this as its own Netlify site with "Base directory" = frontend/apps/platform
# — Netlify walks up from there, finds frontend/pnpm-workspace.yaml, and installs
# the whole workspace (including the shared @alumni/ui package) before building.
#
# Required environment variable (set in the Netlify site's dashboard, not here):
#   NEXT_PUBLIC_PLATFORM_API_URL = <public HTTPS URL for platform-api>
#
# ⚠ platform-api is not yet routed through nginx/exposed publicly (see the
# comment on the platform-api service in docker-compose.prod.yml). Give it a
# subdomain (e.g. platform-api.umat.edu.gh) and an nginx server block — mirror
# the admin-alumat-api.umat.edu.gh block in docker/nginx/nginx.conf — before
# this site's login/dashboard calls will actually work.

[build]
  command = "pnpm --filter @alumni/platform build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
