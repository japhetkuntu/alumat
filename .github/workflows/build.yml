# Builds the services on GitHub and stores the finished builds in this repository, so the server never compiles anything:
# it just pulls them and restarts (deploy/pull-deploy.sh).
#
# The builds live on their own branch, deploy-builds, and main stays the development branch. Every run replaces that
# branch with a single commit, carrying forward the services that did not change, so it never grows. It is a real branch,
# so it is visible on GitHub; see deploy/README.md for keeping it out of your laptop's `git fetch`.
#
# Only what a change affects is rebuilt, using the same rules as deploy/deploy.sh. Each service folder records the commit
# it was built from (.built-sha), which is how the next run, and the server, tell what is current.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "Designs/**", "design-plans/**", "marketing/**", "**/*.md", "backend/tests/**"]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild every service, even if unchanged"
        type: boolean
        default: false

# A second push waits for the running build instead of racing it for the shared ref.
concurrency:
  group: build-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILDS_REF: refs/heads/deploy-builds

jobs:
  plan:
    name: Work out what to build
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.select.outputs.dotnet }}
      frontend: ${{ steps.select.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read what the last build contains
        id: select
        env:
          FORCE_ALL: ${{ inputs.force_all && '1' || '' }}
        run: |
          : > state.txt
          if git fetch --depth 1 origin "+$BUILDS_REF:refs/remotes/builds/latest" 2>/dev/null; then
            for svc in institution-api member-api platform-api operations-worker frontend-institution frontend-member frontend-platform; do
              sha="$(git show "refs/remotes/builds/latest:$svc/.built-sha" 2>/dev/null || true)"
              name="${svc#frontend-}"
              [ -n "$sha" ] && echo "$name $sha" >> state.txt
            done
          else
            echo "No earlier build found: building everything."
          fi
          cat state.txt
          bash deploy/select-targets.sh state.txt | tee -a "$GITHUB_OUTPUT"

  build-dotnet:
    name: Build ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.dotnet != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.dotnet) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        run: |
          case "${{ matrix.service }}" in
            institution-api) P=ReservEase.Alumni.Institution.Api ;;
            member-api) P=ReservEase.Alumni.Member.Api ;;
            platform-api) P=ReservEase.Alumni.Platform.Api ;;
            operations-worker) P=ReservEase.Alumni.Operations.Worker ;;
          esac
          # linux-x64 only: the server is Linux, and without this the output also carries every other platform's native
          # libraries (about 260 MB instead of 65 MB).
          dotnet publish "backend/src/$P/$P.csproj" -c Release -r linux-x64 --no-self-contained -o "build/${{ matrix.service }}"
          tar -czf "${{ matrix.service }}.tgz" -C build "${{ matrix.service }}"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.service }}
          path: ${{ matrix.service }}.tgz
          retention-days: 2
          compression-level: 0

  build-frontend:
    name: Build frontend ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.frontend != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.frontend) }}
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in frontend/package.json, the same one the server uses.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache the Next.js and Turborepo build caches
        uses: actions/cache@v4
        with:
          path: |
            frontend/apps/${{ matrix.app }}/.next/cache
            frontend/.turbo
          key: next-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            next-${{ matrix.app }}-${{ runner.os }}-

      - name: Load the public build settings
        run: |
          # NEXT_PUBLIC_* values are written into the browser bundle at build time. They are public, so they are kept in the
          # repository (deploy/public-env/<app>.env) and mirror the server's frontend env file for this app.
          f="deploy/public-env/${{ matrix.app }}.env"
          [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          if grep -q 'CHANGE_ME' "$f"; then echo "::error::$f still has CHANGE_ME. Put the real NEXT_PUBLIC_ values from the server's env file in it."; exit 1; fi
          grep -E '^NEXT_PUBLIC_[A-Z0-9_]+=' "$f" >> "$GITHUB_ENV" || true
          grep -E '^NEXT_PUBLIC_' "$f" | cut -d= -f1 | sed 's/^/Using /'

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm exec turbo run build --filter="@alumni/${{ matrix.app }}"

      - name: Assemble the standalone server
        run: |
          APP=frontend/apps/${{ matrix.app }}
          OUT=build/frontend-${{ matrix.app }}
          mkdir -p "$OUT/apps/${{ matrix.app }}/.next"
          cp -a "$APP/.next/standalone/." "$OUT/"
          cp -a "$APP/.next/static" "$OUT/apps/${{ matrix.app }}/.next/static"
          if [ -d "$APP/public" ]; then cp -a "$APP/public" "$OUT/apps/${{ matrix.app }}/public"; fi
          # tar keeps the symlinks pnpm puts in node_modules, which a plain artifact upload would lose
          tar -czf "frontend-${{ matrix.app }}.tgz" -C build "frontend-${{ matrix.app }}"

      - uses: actions/upload-artifact@v4
        with:
          name: build-frontend-${{ matrix.app }}
          path: frontend-${{ matrix.app }}.tgz
          retention-days: 2
          compression-level: 0

  publish:
    name: Publish the builds to the repository
    needs: [plan, build-dotnet, build-frontend]
    # Runs when every build that was needed succeeded (a skipped build job just means nothing of that kind changed).
    if: >-
      always() && needs.plan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.plan.outputs.dotnet != '[]' || needs.plan.outputs.frontend != '[]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Replace the changed services and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mkdir builds && cd builds
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git remote add origin "$REPO_URL"

          # Start from the previous builds so services that did not change carry over untouched.
          if git fetch -q --depth 1 origin "+$BUILDS_REF:refs/remotes/builds/latest"; then
            git checkout -q --detach refs/remotes/builds/latest
          fi

          for tgz in ../artifacts/*/*.tgz; do
            name="$(basename "$tgz" .tgz)"
            rm -rf "$name"
            tar -xzf "$tgz" -C .
            echo "${{ github.sha }}" > "$name/.built-sha"
            echo "Updated $name"
          done

          # One commit each time, with no parent, so the stored history never grows. Content that did not change is
          # the same objects as before, so only what changed is uploaded.
          git checkout -q --orphan next
          git add -A
          git commit -q -m "Builds at ${{ github.sha }}"
          git push -q --force origin "HEAD:$BUILDS_REF"
          echo "Published builds for ${{ github.sha }}"
