<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="refresh" content="8" />
<title>We'll be right back — AlumUnion</title>
<style>
  :root { --ink: #14181f; --muted: #6b7280; --line: #e6e2d8; --bg: #f8f6f1; --brand: #2563eb; --brand-dark: #1d4ed8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(20, 24, 31, 0.06);
  }
  .bar { height: 4px; background: linear-gradient(90deg, var(--brand), var(--brand-dark)); }
  .content { padding: 40px 36px 36px; text-align: center; }
  .mark {
    width: 44px; height: 44px; margin: 0 auto 22px;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; letter-spacing: -0.02em;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { font-size: 14px; line-height: 1.65; color: var(--muted); margin: 0 0 4px; }
  .dots { display: inline-flex; gap: 5px; margin-top: 22px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--brand);
    opacity: 0.25; animation: pulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .foot { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: #9aa1ad; }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: 0.6; } }
</style>
</head>
<body>
  <div class="card">
    <div class="bar"></div>
    <div class="content">
      <div class="mark">A</div>
      <h1>We'll be right back</h1>
      <p>We're rolling out an update to AlumUnion.</p>
      <p>This page refreshes on its own — no need to keep reloading.</p>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="foot">Usually done in under a minute.</div>
    </div>
  </div>
</body>
</html>
