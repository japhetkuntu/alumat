# The HTTPS version of nginx.conf — swap this in AFTER both wildcard certs exist
# (see install.sh's step 5 for the exact `certbot certonly --dns-...` commands).
#
#   cp deploy/nginx.ssl.conf /tmp/alumunion.ssl.conf
#   sed -i \
#     -e "s/__PLATFORM_BASE_DOMAIN__/yourdomain.com/g" \
#     -e "s/__ADMIN_BASE_DOMAIN__/admin.yourdomain.com/g" \
#     -e "s/__PLATFORM_SUBDOMAIN__/platform.yourdomain.com/g" \
#     /tmp/alumunion.ssl.conf
#   cp /tmp/alumunion.ssl.conf /etc/nginx/sites-available/alumunion
#   nginx -t && systemctl reload nginx
#
# Cert paths below assume certbot's default naming — the live/ folder is named
# after the FIRST -d passed to `certbot certonly`. If you passed the domains in
# a different order than install.sh suggests, check the real folder names with
# `certbot certificates` and adjust the two ssl_certificate lines below to match.

server {
	listen 80;
	listen [::]:80;
	server_name *.__PLATFORM_BASE_DOMAIN__ __PLATFORM_BASE_DOMAIN__
	            *.__ADMIN_BASE_DOMAIN__ __PLATFORM_SUBDOMAIN__;

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name *.__PLATFORM_BASE_DOMAIN__ __PLATFORM_BASE_DOMAIN__;

	ssl_certificate     /etc/letsencrypt/live/__PLATFORM_BASE_DOMAIN__/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/__PLATFORM_BASE_DOMAIN__/privkey.pem;

	# Explicit TLS hardening — this file doesn't `include` a shared
	# ssl-params.conf (install.sh only copies this one templated file), and
	# leaving these unset falls back to whatever the distro's nginx package
	# defaults to, which on older Ubuntu LTS releases still permits TLSv1/1.1.
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
	ssl_prefer_server_ciphers off;
	ssl_session_cache   shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 50M;

	# Same header set as docker/nginx/security-headers-app.conf — see that
	# file's comments for the full CSP rationale.
	add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
	add_header X-Frame-Options            "SAMEORIGIN"                       always;
	add_header X-Content-Type-Options     "nosniff"                          always;
	add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
	add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
	add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

	location = /health {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "OK\n";
	}

	# Same-origin API proxy — see apps/member/src/lib/api-client.ts. Host is
	# forwarded unchanged, which is what TenantResolutionMiddleware reads to
	# resolve {slug}.
	location /api/ {
		proxy_pass http://127.0.0.1:5002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://127.0.0.1:3002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
	}

	gzip on;
	gzip_types application/json text/css application/javascript;
}

server {
