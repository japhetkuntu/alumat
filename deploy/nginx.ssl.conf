# The HTTPS version of nginx.conf — swap this in AFTER both wildcard certs exist
# (see install.sh's step 5 for the exact `certbot certonly --dns-...` commands).
#
#   cp deploy/nginx.ssl.conf /tmp/alumunion.ssl.conf
#   sed -i \
#     -e "s/__PLATFORM_BASE_DOMAIN__/yourdomain.com/g" \
#     -e "s/__ADMIN_BASE_DOMAIN__/admin.yourdomain.com/g" \
#     -e "s/__PLATFORM_SUBDOMAIN__/platform.yourdomain.com/g" \
#     /tmp/alumunion.ssl.conf
#   cp /tmp/alumunion.ssl.conf /etc/nginx/sites-available/alumunion
#   nginx -t && systemctl reload nginx
#
# Cert paths below assume certbot's default naming — the live/ folder is named
# after the FIRST -d passed to `certbot certonly`. If you passed the domains in
# a different order than install.sh suggests, check the real folder names with
# `certbot certificates` and adjust the two ssl_certificate lines below to match.
#
# Rate limiting — these zone directives must live at http{} scope, which this
# file reaches via Ubuntu's default /etc/nginx/nginx.conf `include
# /etc/nginx/sites-enabled/*;` inside its own http{} block, so defining them
# here (outside any server{}) lands them in the right place.
#
# This is a coarse, cheap-to-reject outer net — NOT a replacement for the
# app's own AddAlumniRateLimiting() (see
# backend/src/ReservEase.Alumni.Common.Sdk/Extensions/RateLimitingExtensions.cs),
# which enforces the real business-rule limits (10 auth requests/min,
# partitioned by Host+IP so one shared-NAT institution can't throttle
# another). nginx's job here is just to reject an outright flood — hundreds
# of requests/sec — for near-zero cost, before it ever reaches a .NET worker
# thread. api_auth is deliberately much looser than the app's 10/min so it
# never fires before the app's own check does; it exists only to stop raw
# volumetric abuse. Every endpoint under /api/ besides auth currently has NO
# app-level limit at all (only auth + a couple of public-read endpoints are
# decorated with [EnableRateLimiting]), so api_general is the only throttle
# most of the API surface has.
#
# `nodelay` on both zones — this partitions by IP alone (nginx can't see
# auth/session state to tell individual users apart), and an institution's
# members can share one IP (campus WiFi, corporate NAT), so the burst
# values below are sized generously past any realistic simultaneous-human
# traffic (30 people logging in within the same second from one IP is
# already bot territory, not a busy school). Within that burst, everyone
# succeeds instantly — no delay at all.
#
# Tried the opposite (queue-without-reject, no `nodelay`) first and walked
# it back: nginx's queue has no cap on how long a single request can wait,
# only on how many can be queued (burst) — under sustained excess (e.g.
# repeated test traffic from one IP piling up across many requests) that
# produced real 30-40 SECOND response times in practice, which is worse
# than a fast, clear 429. A login button that hangs for 40 seconds looks
# broken; a fast rejection at least tells the client to retry.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
# nginx's default rejection status for both is 503 (reads as "server is
# down" to a client) — 429 is the correct, standard "you're being
# throttled, retry later" status and is what api-client.ts et al. should
# actually branch on.
limit_req_status 429;
limit_conn_status 429;

server {
	listen 80;
	listen [::]:80;
	server_name *.__PLATFORM_BASE_DOMAIN__ __PLATFORM_BASE_DOMAIN__
	            *.__ADMIN_BASE_DOMAIN__ __PLATFORM_SUBDOMAIN__;

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name *.__PLATFORM_BASE_DOMAIN__ __PLATFORM_BASE_DOMAIN__;

	ssl_certificate     /etc/letsencrypt/live/__PLATFORM_BASE_DOMAIN__/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/__PLATFORM_BASE_DOMAIN__/privkey.pem;

	# Explicit TLS hardening — this file doesn't `include` a shared
	# ssl-params.conf (install.sh only copies this one templated file), and
	# leaving these unset falls back to whatever the distro's nginx package
	# defaults to, which on older Ubuntu LTS releases still permits TLSv1/1.1.
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
	ssl_prefer_server_ciphers off;
	ssl_session_cache   shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 50M;

	# Same header set as docker/nginx/security-headers-app.conf — see that
	# file's comments for the full CSP rationale.
	add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
	add_header X-Frame-Options            "SAMEORIGIN"                       always;
	add_header X-Content-Type-Options     "nosniff"                          always;
	add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
	add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
	add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

	# Blanket per-IP connection cap — cheap protection against raw connection
	# floods, covers every location in this server block including static
	# assets, not just /api/.
	limit_conn conn_per_ip 100;

	location = /health {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "OK\n";
	}

	# Paystack's webhook (PaystackCallbackController.cs) — deliberately NOT
	# request-rate limited. It's already self-authenticating (HMAC signature
	# over the raw body, verified before anything else happens), so an
	# IP-based quota adds no real security here — it only adds risk. Paystack
	# webhooks arrive from a small, fixed set of Paystack's own IPs shared
	# across every institution's traffic, can legitimately burst during a
	# busy campaign, and the controller's own comment is explicit: "Always
	# return 200 to stop Paystack retries" — a 429 here doesn't stop the
	# traffic, it just makes Paystack retry the same event into a worse
	# burst, and a dropped delivery means a real payment silently never gets
	# confirmed. Regex (not a literal /api/v1/ path) so a future API version
	# bump doesn't silently stop matching this.
	location ~ ^/api/v\d+/callbacks/paystack$ {
		proxy_pass http://127.0.0.1:5002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Tighter limiter for the auth surface specifically (login, register,
	# verify-otp, resend-otp, forgot/reset-password, google, refreshtoken —
	# see MembersController.cs's [Route("api/v{version}/auth")]) — matched
	# by regex so it covers every API version, not just v1. Must be declared
	# before the general /api/ location below: nginx checks regex locations
	# against the best-matching prefix location, and a regex match wins.
	location ~ ^/api/v\d+/auth/ {
		limit_req zone=api_auth burst=30 nodelay;
		proxy_pass http://127.0.0.1:5002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Same-origin API proxy — see apps/member/src/lib/api-client.ts. Host is
	# forwarded unchanged, which is what TenantResolutionMiddleware reads to
	# resolve {slug}. Everything here besides auth (above) currently has no
	# app-level rate limit of its own, so this is the only throttle most of
	# the API surface has.
	location /api/ {
		limit_req zone=api_general burst=100 nodelay;
		proxy_pass http://127.0.0.1:5002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://127.0.0.1:3002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
	}

	gzip on;
	gzip_types application/json text/css application/javascript;
}

