# Template installed at /etc/nginx/sites-available/alumunion by install.sh, which
# substitutes __PLATFORM_BASE_DOMAIN__ / __ADMIN_BASE_DOMAIN__ / __PLATFORM_SUBDOMAIN__
# for the real domains you provide. This is deliberately PLAIN HTTP ONLY — unlike a
# single-hostname setup where `certbot --nginx` can safely auto-insert the HTTPS
# blocks in place, this project needs TWO separate wildcard certs obtained via
# DNS-01 (`certbot certonly`, see install.sh's step 5), which certbot cannot
# auto-wire into an nginx config for you. Once both certs exist, replace this
# file's content with deploy/nginx.ssl.conf (same placeholders, already filled
# in from your last `nginx -t` run) — see the comment at the top of that file.
#
# Routing model (all same-origin — each frontend calls "/api/v1/..." on its own
# host, and Nginx forwards the Host header unchanged, which is what
# TenantResolutionMiddleware reads to resolve the institution):
#
#   {slug}.__PLATFORM_BASE_DOMAIN__        → frontend-member  (127.0.0.1:3002)
#   {slug}.__PLATFORM_BASE_DOMAIN__/api/   → member-api       (127.0.0.1:5002)
#   __PLATFORM_BASE_DOMAIN__ (apex)        → same as above, falls back to
#                                             DefaultInstitutionSlug
#   {slug}.__ADMIN_BASE_DOMAIN__           → frontend-institution (127.0.0.1:3001)
#   {slug}.__ADMIN_BASE_DOMAIN__/api/      → institution-api  (127.0.0.1:5001)
#   __PLATFORM_SUBDOMAIN__                 → frontend-platform (127.0.0.1:3003)
#   __PLATFORM_SUBDOMAIN__/api/            → platform-api     (127.0.0.1:5003)

server {
	listen 80;
	listen [::]:80;
	server_name *.__PLATFORM_BASE_DOMAIN__ __PLATFORM_BASE_DOMAIN__;

	client_max_body_size 50M;

	location = /health {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "OK\n";
	}

	location /api/ {
		proxy_pass http://127.0.0.1:5002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://127.0.0.1:3002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
	}

	gzip on;
	gzip_types application/json text/css application/javascript;
}

