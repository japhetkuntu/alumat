# Template installed at /etc/nginx/sites-available/alumunion by install.sh, which
# substitutes __PLATFORM_BASE_DOMAIN__ / __ADMIN_BASE_DOMAIN__ / __PLATFORM_SUBDOMAIN__
# for the real domains you provide. This is deliberately PLAIN HTTP ONLY — unlike a
# single-hostname setup where `certbot --nginx` can safely auto-insert the HTTPS
# blocks in place, this project needs TWO separate wildcard certs obtained via
# DNS-01 (`certbot certonly`, see install.sh's step 5), which certbot cannot
# auto-wire into an nginx config for you. Once both certs exist, replace this
# file's content with deploy/nginx.ssl.conf (same placeholders, already filled
# in from your last `nginx -t` run) — see the comment at the top of that file.
#
# Routing model (all same-origin — each frontend calls "/api/v1/..." on its own
# host, and Nginx forwards the Host header unchanged, which is what
# TenantResolutionMiddleware reads to resolve the institution):
#
#   {slug}.__PLATFORM_BASE_DOMAIN__        → frontend-member  (127.0.0.1:3002)
#   {slug}.__PLATFORM_BASE_DOMAIN__/api/   → member-api       (127.0.0.1:5002)
#   __PLATFORM_BASE_DOMAIN__ (apex)        → same as above, falls back to
#                                             DefaultInstitutionSlug
#   {slug}.__ADMIN_BASE_DOMAIN__           → frontend-institution (127.0.0.1:3001)
#   {slug}.__ADMIN_BASE_DOMAIN__/api/      → institution-api  (127.0.0.1:5001)
#   __PLATFORM_SUBDOMAIN__                 → frontend-platform (127.0.0.1:3003)
#   __PLATFORM_SUBDOMAIN__/api/            → platform-api     (127.0.0.1:5003)
#
# Rate limiting — see deploy/nginx.ssl.conf's comment for the full rationale
# (coarse, cheap-to-reject outer net; the app's own AddAlumniRateLimiting()
# is the real business-rule enforcement; no `nodelay` on either zone so a
# shared IP — campus WiFi, corporate NAT — gets queued/delayed instead of
# hard-rejected). Zone directives must live at http{} scope, reached here
# via Ubuntu's default nginx.conf `include /etc/nginx/sites-enabled/*;`.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
	listen 80;
	listen [::]:80;
	server_name *.__PLATFORM_BASE_DOMAIN__ __PLATFORM_BASE_DOMAIN__;

	client_max_body_size 50M;

	# Same header set as docker/nginx/security-headers-app.conf — kept inline
	# here (rather than an `include`) because install.sh only ever installs
	# this one templated file, not a second snippet alongside it. See that
	# file's comments for the full CSP rationale (Google Sign-In on the
	# member portal, OpenStreetMap tiles for the alumni map, styled-jsx/RSC
	# hydration needing 'unsafe-inline').
	add_header X-Frame-Options        "SAMEORIGIN"                       always;
	add_header X-Content-Type-Options "nosniff"                          always;
	add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
	add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

	limit_conn conn_per_ip 100;

	location = /health {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "OK\n";
	}

	# Paystack's webhook — deliberately NOT rate limited. See
	# nginx.ssl.conf's comment on the equivalent block for the full
	# rationale (already HMAC-signature-authenticated; a 429 here just
	# makes Paystack retry into a worse burst, and a dropped delivery means
	# a real payment silently never gets confirmed).
	location ~ ^/api/v\d+/callbacks/paystack$ {
		proxy_pass http://127.0.0.1:5002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ~ ^/api/v\d+/auth/ {
		limit_req zone=api_auth burst=30;
		proxy_pass http://127.0.0.1:5002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /api/ {
		limit_req zone=api_general burst=100;
		proxy_pass http://127.0.0.1:5002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://127.0.0.1:3002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
	}

	gzip on;
	gzip_types application/json text/css application/javascript;
}

