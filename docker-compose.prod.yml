# =============================================================================
# ReservEase Alumni – Production Docker Compose
# =============================================================================
# Usage:
#   cp .env.production.example .env   # then fill in all secrets
#   ./deploy.sh                       # guided full deployment
# Prerequisites:
#   .env must be populated (no defaults for secrets in this file)
# =============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    env_file: .env
    image: postgres:16-alpine
    container_name: alumni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback-only: not reachable from the internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - alumni-net

  redis:
    env_file: .env
    image: redis:7-alpine
    container_name: alumni-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Loopback-only.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - alumni-net

  minio:
    env_file: .env
    image: minio/minio:latest
    container_name: alumni-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    # Expose MinIO externally so uploaded files can be served from the browser.
    ports:
      - "0.0.0.0:${MINIO_API_PORT:-9000}:9000"
      - "0.0.0.0:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - alumni-net

  minio-init:
    env_file: .env
    image: minio/mc:latest
    container_name: alumni-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://alumni-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/$$MINIO_BUCKET_NAME;
        mc anonymous set download local/$$MINIO_BUCKET_NAME;
        exit 0;
      "
    networks:
      - alumni-net

  # ── Backend APIs ─────────────────────────────────────────────────────────────
  # No host ports – nginx routes all external traffic internally.

  institution-api:
    env_file: .env
    build:
      context: ./backend
      dockerfile: src/ReservEase.Alumni.Institution.Api/Dockerfile
    image: alumni/institution-api:prod
    container_name: alumni-institution-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      USE_HTTPS_REDIRECT: ${USE_HTTPS_REDIRECT:-false}
      ConnectionStrings__AlumniConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=alumni
      # "admin." prefix is a separate wildcard level from Member.Api's bare
      # PLATFORM_BASE_DOMAIN below — see docker/nginx/nginx.wildcard.conf.
      PlatformBaseDomain: admin.${PLATFORM_BASE_DOMAIN:-yourplatform.example}
      DefaultInstitutionSlug: ${DEFAULT_INSTITUTION_SLUG:-demo}
      Redis__InstitutionRedisConfig__ConnectionString: redis:6379
      Redis__InstitutionRedisConfig__DbNumber: 0
      BearerTokenConfig__Issuer: ${JWT_ISSUER}
      BearerTokenConfig__Audience: ${JWT_AUDIENCE}
      BearerTokenConfig__InstitutionSigningKey: ${INSTITUTION_SIGNING_KEY}
      BearerTokenConfig__MemberSigningKey: ${MEMBER_SIGNING_KEY}
      MailtrapConfig__ApiKey: ${MAILTRAP_API_KEY}
      MailtrapConfig__DefaultMessageSource__Name: ${MAIL_SENDER_NAME}
      MailtrapConfig__DefaultMessageSource__Email: ${MAIL_SENDER_EMAIL}
      StorageConfig__AccessKey: ${STORAGE_ACCESS_KEY}
      StorageConfig__SecretKey: ${STORAGE_SECRET_KEY}
      StorageConfig__BucketName: ${STORAGE_BUCKET}
      StorageConfig__Region: ${STORAGE_REGION}
      StorageConfig__Endpoint: ${STORAGE_ENDPOINT}
      StorageConfig__CdnEndpoint: ${STORAGE_CDN_ENDPOINT}
      StorageConfig__RootFolder: ${STORAGE_ROOT_FOLDER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - alumni-net

  member-api:
    env_file: .env
    build:
      context: ./backend
      dockerfile: src/ReservEase.Alumni.Member.Api/Dockerfile
    image: alumni/member-api:prod
    container_name: alumni-member-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      USE_HTTPS_REDIRECT: ${USE_HTTPS_REDIRECT:-false}
      ConnectionStrings__AlumniConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=alumni
      # Bare domain — the member-facing, memorable one. Institution.Api gets
      # the "admin." prefixed variant above so the two never collide.
      PlatformBaseDomain: ${PLATFORM_BASE_DOMAIN:-yourplatform.example}
      DefaultInstitutionSlug: ${DEFAULT_INSTITUTION_SLUG:-demo}
      Redis__MemberRedisConfig__ConnectionString: redis:6379
      Redis__MemberRedisConfig__DbNumber: 1
      BearerTokenConfig__Issuer: ${JWT_ISSUER}
      BearerTokenConfig__Audience: ${JWT_AUDIENCE}
      BearerTokenConfig__InstitutionSigningKey: ${INSTITUTION_SIGNING_KEY}
      BearerTokenConfig__MemberSigningKey: ${MEMBER_SIGNING_KEY}
      PaystackConfig__SecretKey: ${PAYSTACK_SECRET_KEY}
      PaystackConfig__PublicKey: ${PAYSTACK_PUBLIC_KEY}
      PaystackConfig__CallbackUrl: ${PAYSTACK_CALLBACK_URL}
      MailtrapConfig__ApiKey: ${MAILTRAP_API_KEY}
      MailtrapConfig__DefaultMessageSource__Name: ${MAIL_SENDER_NAME}
      MailtrapConfig__DefaultMessageSource__Email: ${MAIL_SENDER_EMAIL}
      StorageConfig__AccessKey: ${STORAGE_ACCESS_KEY}
      StorageConfig__SecretKey: ${STORAGE_SECRET_KEY}
      StorageConfig__BucketName: ${STORAGE_BUCKET}
      StorageConfig__Region: ${STORAGE_REGION}
      StorageConfig__Endpoint: ${STORAGE_ENDPOINT}
      StorageConfig__CdnEndpoint: ${STORAGE_CDN_ENDPOINT}
      StorageConfig__RootFolder: ${STORAGE_ROOT_FOLDER:-}
      ArkeselConfig__ApiKey: ${ARKESEL_API_KEY}
      ArkeselConfig__SenderId: ${ARKESEL_SENDER_ID}
      WaSenderConfig__ApiKey: ${WASENDER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - alumni-net

  platform-api:
    env_file: .env
    build:
      context: ./backend
      dockerfile: src/ReservEase.Alumni.Platform.Api/Dockerfile
    image: alumni/platform-api:prod
    container_name: alumni-platform-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      USE_HTTPS_REDIRECT: ${USE_HTTPS_REDIRECT:-false}
      ConnectionStrings__AlumniConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SearchPath=alumni
      PlatformBaseDomain: ${PLATFORM_BASE_DOMAIN:-yourplatform.example}
      DefaultInstitutionSlug: ${DEFAULT_INSTITUTION_SLUG:-demo}
      Redis__PlatformRedisConfig__ConnectionString: redis:6379
      Redis__PlatformRedisConfig__DbNumber: 2
      BearerTokenConfig__Issuer: ${JWT_ISSUER}
      BearerTokenConfig__Audience: ${JWT_AUDIENCE}
      BearerTokenConfig__PlatformSigningKey: ${PLATFORM_SIGNING_KEY}
      StorageConfig__AccessKey: ${STORAGE_ACCESS_KEY}
      StorageConfig__SecretKey: ${STORAGE_SECRET_KEY}
      StorageConfig__BucketName: ${STORAGE_BUCKET}
      StorageConfig__Region: ${STORAGE_REGION}
      StorageConfig__Endpoint: ${STORAGE_ENDPOINT}
      StorageConfig__CdnEndpoint: ${STORAGE_CDN_ENDPOINT}
      StorageConfig__RootFolder: ${STORAGE_ROOT_FOLDER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alumni-net
    # Routed through nginx once NGINX_CONF_FILE points at nginx.wildcard.conf
    # (platform.{PLATFORM_BASE_DOMAIN} → frontend-platform, same-origin /api/
    # → this service) — inert on nginx.conf/nginx.ip.conf, which don't route it.

  # ── Frontend Apps ─────────────────────────────────────────────────────────
  # These apps call the API same-origin ("/api/v1/...", proxied by nginx —
  # see nginx.conf's per-host "location /api/" blocks) so that any number of
  # institution subdomains resolve to the correct tenant automatically,
  # instead of every deployment being wired to one fixed API hostname at
  # build time. INSTITUTION_API_INTERNAL_URL / MEMBER_API_INTERNAL_URL below are a
  # separate, server-only concern: Next.js's own server-side rendering (the
  # tenant theme fetch) runs inside this container, not the browser, so it
  # needs the API's internal Compose DNS name — set as a plain runtime env,
  # not a NEXT_PUBLIC_ build arg, since it must never reach the client bundle.

  frontend-institution:
    env_file: .env
    build:
      context: ./frontend
      dockerfile: apps/institution/Dockerfile
    image: alumni/frontend-institution:prod
    container_name: alumni-frontend-institution
    restart: unless-stopped
    environment:
      INSTITUTION_API_INTERNAL_URL: http://institution-api:8080/api/v1
    depends_on:
      - institution-api
    networks:
      - alumni-net

  frontend-member:
    env_file: .env
    build:
      context: ./frontend
      dockerfile: apps/member/Dockerfile
    image: alumni/frontend-member:prod
    container_name: alumni-frontend-member
    restart: unless-stopped
    environment:
      MEMBER_API_INTERNAL_URL: http://member-api:8080/api/v1
    depends_on:
      - member-api
    networks:
      - alumni-net

  frontend-platform:
    env_file: .env
    build:
      context: ./frontend
      dockerfile: apps/platform/Dockerfile
      # Left unset (empty) so api-client.ts's own "/api/v1" same-origin
      # fallback applies — mirrors how frontend-institution/member never
      # pass their NEXT_PUBLIC_*_API_URL build arg either.
      args:
        NEXT_PUBLIC_PLATFORM_API_URL: ""
    image: alumni/frontend-platform:prod
    container_name: alumni-frontend-platform
    restart: unless-stopped
    depends_on:
      - platform-api
    networks:
      - alumni-net

  # ── Gateway ────────────────────────────────────────────────────────────────
  # Only service that exposes ports to the internet.

  nginx:
    image: nginx:1.27-alpine
    container_name: alumni-nginx
    restart: unless-stopped
    ports:
      # Domain mode: only 80 + 443 are needed.
      - "80:80"
      - "443:443"
      # IP mode (nginx.ip.conf): one port per service.
      - "8001:8001"   # institution portal frontend
      - "8003:8003"   # member api
      - "8002:8002"   # admin api
    volumes:
      - ${NGINX_CONF_FILE:-./docker/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - institution-api
      - member-api
      - platform-api
      - frontend-institution
      - frontend-member
      - frontend-platform
    networks:
      - alumni-net

  # ── SSL auto-renewal ───────────────────────────────────────────────────────
  # Issues initial cert via: ./deploy.sh --ssl
  # Checks for renewal every 12 h automatically.

  certbot:
    image: certbot/certbot:latest
    container_name: alumni-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  postgres_data:
    name: alumni_postgres_data
  redis_data:
    name: alumni_redis_data
  minio_data:
    name: alumni_minio_data
  certbot_www:
    name: alumni_certbot_www
  certbot_conf:
    name: alumni_certbot_conf

# =============================================================================
# Networks
# =============================================================================
networks:
  alumni-net:
    name: alumni-net
    driver: bridge
